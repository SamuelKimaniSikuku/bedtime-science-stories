/* ---------- state ---------- */
let lang = "en";
let regionFilter = "all";
let topicFilter = "all";
let genderFilter = "all";
let searchQuery = "";

// Fold accents so "Ngugi" finds "Ngũgĩ" and "Francais" finds "Français".
const fold = s => (s || "").toString().toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/[’']/g, "'");

// A story matches if every word typed appears somewhere in it — the person, the
// title, the teaser, country, era, categories, and the story text itself, so
// "ants", "windmill" or "gorillas" find the right bedtime story.
const searchIndex = new Map();
function haystack(s) {
  const key = s.id + ":" + lang;
  let hay = searchIndex.get(key);
  if (hay === undefined) {
    hay = fold([
      s.name, s.years, pick(s.title), pick(s.hook), pick(s.country),
      pick(REGIONS[s.region]), pick(TOPICS[s.topic]),
      REGIONS[s.region]?.en, TOPICS[s.topic]?.en, s.country?.en,
      (pick(s.text) || []).join(" ")
    ].join(" ")).replace(/<[^>]+>/g, " ");
    searchIndex.set(key, hay);
  }
  return hay;
}
function matchesSearch(s) {
  if (!searchQuery) return true;
  const hay = haystack(s);
  return fold(searchQuery).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
}

// Languages. Full UI + content exist for en/sw/fr. The African heritage
// languages below fall back to French for the interface, audio, and any story
// text not yet translated — drop a `wo` / `bbj` / `fmp` key into a story's
// title/hook/text/country to make that translation appear automatically.
// Wolof (wo), Ghomála’ (bbj) and Feʼefeʼe/Fussap (fmp) are hidden until native
// translations exist — no engine supports bbj/fmp, and machine-drafted heritage
// language would teach a child invented grammar. To bring one back, simply
// re-add its line below; the effLang()/pick() fallback machinery is still here,
// so a story shows its real translation as soon as a wo/bbj/fmp key is added.
// `fallback` is the language used for the interface, the audio narration and any
// story not yet translated — chosen to be the one that language's readers are most
// likely to also read (Kiswahili for Kikuyu, French for the Senegal/Cameroon set).
const LANGS = [
  { code: "en",  label: "English",   short: "EN", group: "world"  },
  { code: "fr",  label: "Français",  short: "FR", group: "world"  },
  { code: "sw",  label: "Kiswahili", short: "SW", group: "africa" },
  { code: "ki",  label: "Gĩkũyũ",    short: "Gĩ", group: "africa", fallback: "sw" }
  // Ready to switch on the moment real translations exist. A language only needs
  // its line uncommented here, plus a matching key on each story's title/text —
  // inLang() then lists exactly the stories that have it.
  // { code: "bxk", label: "Lubukusu (Luhya)",                short: "Bk", group: "africa", fallback: "sw" },
  // { code: "wo",  label: "Wolof",                          short: "Wo", group: "africa", fallback: "fr" },
  // { code: "bbj", label: "Ghomála’ (Bandjoun)",            short: "Gh", group: "africa", fallback: "fr" },
  // { code: "fmp", label: "Feʼefeʼe / Fussap (Bafoussam)",  short: "Fè", group: "africa", fallback: "fr" }
];
const LANG_LABEL = Object.fromEntries(LANGS.map(l => [l.code, l.label]));
const LANG_FALLBACK = Object.fromEntries(LANGS.map(l => [l.code, l.fallback || "fr"]));
// Closing line for languages without a full interface, in their own words.
const LANG_GOODNIGHT = { ki: "Mũthĩa. Ũtukũ mwega 🌙" };
const UI_LANGS = ["en", "sw", "fr"];               // languages with a full interface
function effLang() { return UI_LANGS.includes(lang) ? lang : LANG_FALLBACK[lang]; }
function pick(o) { return o ? (o[lang] != null ? o[lang] : o[effLang()]) : ""; }  // story field, supports drop-in translations

// Stories available in the chosen language. Full-interface languages have every
// story; a partially translated one (Gĩkũyũ today) lists only what really exists.
function inLang() {
  return UI_LANGS.includes(lang) ? STORIES : STORIES.filter(s => s.text?.[lang]);
}

// Shown when a story has no translation yet in the chosen language, worded in
// whichever language we are actually falling back to.
function xlateNote() {
  const name = LANG_LABEL[lang], f = effLang();
  if (f === "sw") return `🌍 Hadithi hii bado haipo kwa ${name} — inaonyeshwa kwa Kiswahili kwa sasa.`;
  if (f === "en") return `🌍 This story isn't in ${name} yet — showing English for now.`;
  return `🌍 Histoire bientôt disponible en ${name} — affichée en français pour le moment.`;
}

/* ---------- stars ---------- */
(function makeStars() {
  const holder = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = 1 + (i % 3);
    s.style.width = s.style.height = size + "px";
    s.style.left = ((i * 37) % 100) + "%";
    s.style.top = ((i * 53) % 100) + "%";
    s.style.animationDelay = ((i * 0.13) % 3) + "s";
    holder.appendChild(s);
  }
})();

/* ---------- rendering ---------- */
const REGION_COLORS = {
  africa: "var(--accent-africa)", europe: "var(--accent-europe)",
  americas: "var(--accent-americas)", asia: "var(--accent-asia)"
};

function chipHtml(key, label, active, kind, dot, count) {
  // A chip with nothing behind it would be a dead end — dim it and switch it off.
  const zero = count === 0 && !active ? " zero" : "";
  return `<button class="chip${active ? " active" : ""}${zero}" data-kind="${kind}" data-key="${key}"${zero ? " disabled" : ""}>` +
    (dot ? `<span class="dot" style="background:${dot}"></span>` : "") +
    label +
    (count != null ? `<span class="cnt">${count}</span>` : "") +
    `</button>`;
}

function render() {
  const t = UI[effLang()];
  document.documentElement.lang = lang;
  document.getElementById("siteTitle").textContent = t.title;
  document.getElementById("siteSubtitle").textContent = t.subtitle;
  document.getElementById("regionLabel").textContent = t.region;
  document.getElementById("topicLabel").textContent = t.topic;
  document.getElementById("genderLabel").textContent = t.gender;
  document.getElementById("footerLine").textContent = t.footer;
  updateMusicBtn();
  renderFeedback();
  // Set properties rather than rebuilding the input, so typing keeps focus.
  const searchEl = document.getElementById("searchInput");
  searchEl.placeholder = t.search;
  if (searchEl.value !== searchQuery) searchEl.value = searchQuery;
  document.getElementById("searchClear").hidden = !searchQuery;

  const langBtnHtml = l =>
    `<button class="lang-btn ${l.code === lang ? "active" : ""}" data-lang="${l.code}">${l.label}</button>`;
  const africaLangs = LANGS.filter(l => l.group === "africa");
  // Only show the "African languages" grouping once there are several of them;
  // with a single one it reads better as a plain row.
  document.getElementById("langSwitch").innerHTML = africaLangs.length > 1
    ? `<div class="lang-row">${LANGS.filter(l => l.group === "world").map(langBtnHtml).join("")}</div>` +
      `<div class="lang-africa">` +
        `<span class="lang-africa-label">${effLang() === "fr" && lang !== "fr" ? "Langues africaines" : "African languages"}</span>` +
        `<div class="lang-row">${africaLangs.map(langBtnHtml).join("")}</div>` +
      `</div>`
    : `<div class="lang-row">${LANGS.map(langBtnHtml).join("")}</div>`;

  // For a partially translated language (e.g. Gĩkũyũ) show only the stories that
  // actually exist in it, so the library never pretends a translation is there.
  // Counts follow the search too, so a category never promises stories the
  // current search has already ruled out.
  const pool = inLang().filter(matchesSearch);

  document.getElementById("regionChips").innerHTML =
    chipHtml("all", t.all, regionFilter === "all", "region", null, pool.length) +
    Object.keys(REGIONS).map(k =>
      chipHtml(k, pick(REGIONS[k]), regionFilter === k, "region", REGION_COLORS[k],
        pool.filter(s => s.region === k).length)).join("");

  document.getElementById("topicChips").innerHTML =
    chipHtml("all", t.all, topicFilter === "all", "topic", null, pool.length) +
    Object.keys(TOPICS).map(k =>
      chipHtml(k, `${TOPICS[k].emoji} ${pick(TOPICS[k])}`, topicFilter === k, "topic", null,
        pool.filter(s => s.topic === k).length)).join("");

  document.getElementById("genderChips").innerHTML =
    chipHtml("all", t.all, genderFilter === "all", "gender", null, pool.length) +
    Object.keys(GENDERS).map(k =>
      chipHtml(k, `${GENDERS[k].emoji} ${pick(GENDERS[k])}`, genderFilter === k, "gender", null,
        pool.filter(s => s.gender === k).length)).join("");

  const bornYear = s => s.born ?? parseInt((s.years.match(/\d{4}/) || ["9999"])[0], 10);
  const visible = pool.filter(s =>
    (regionFilter === "all" || s.region === regionFilter) &&
    (topicFilter === "all" || s.topic === topicFilter) &&
    (genderFilter === "all" || s.gender === genderFilter)
  ).sort((a, b) => bornYear(a) - bornYear(b));

  document.getElementById("countLine").textContent = t.showing(visible.length);

  const grid = document.getElementById("grid");
  grid.innerHTML = visible.length === 0
    ? `<div class="empty">${searchQuery ? t.noMatch(searchQuery) : t.empty}</div>`
    : visible.map(s => `
      <div class="card" data-story="${s.id}">
        <div class="card-top">
          <div class="avatar">${s.emoji}</div>
          <div>
            <h2>${s.name}</h2>
            <div class="years">${s.years} · ${pick(s.country)}</div>
          </div>
        </div>
        <div class="card-title">${pick(s.title)}</div>
        <div class="hook">${pick(s.hook)}</div>
        <div class="badges">
          <span class="badge region-${s.region}">${pick(REGIONS[s.region])}</span>
          <span class="badge topic">${TOPICS[s.topic].emoji} ${pick(TOPICS[s.topic])}</span>
        </div>
        <div class="read-hint">${t.read}</div>
      </div>`).join("");
}

function openReader(id) {
  const s = STORIES.find(x => x.id === id);
  if (!s) return;
  if (typeof stopNarration === "function") stopNarration();
  const t = UI[effLang()];
  const reader = document.getElementById("reader");
  reader.innerHTML = `
    <button class="close-btn" id="closeReader" aria-label="Close">✕</button>
    <div class="reader-langs">${LANGS.map(l =>
      `<button class="lang-btn ${l.code === lang ? "active" : ""}" data-reader-lang="${l.code}">${l.short}</button>`).join("")}
    </div>
    <div class="avatar">${s.emoji}</div>
    <h2>${s.name}</h2>
    <div class="story-title">${pick(s.title)}</div>
    <div class="meta">${s.years} · ${t.born} ${pick(s.country)}</div>
    <div class="badges">
      <span class="badge region-${s.region}">${pick(REGIONS[s.region])}</span>
      <span class="badge topic">${TOPICS[s.topic].emoji} ${pick(TOPICS[s.topic])}</span>
    </div>
    ${(!UI_LANGS.includes(lang) && pick(s.text) === s.text[effLang()]) ? `<div class="xlate-note">${xlateNote()}</div>` : ""}
    ${!explicitVoiceParam ? `<div class="chip-row" style="margin:6px 0 10px">${
      Object.entries(HOUSE_VOICES).map(([k, label]) =>
        `<button class="chip ${k === narrator ? "active" : ""}" data-narrator="${k}">${label}</button>`).join("")
    }</div>` : ""}
    ${lengthsFor(s).length > 1 ? `<div class="chip-row" style="margin:0 0 10px">${
      lengthsFor(s).map(len =>
        `<button class="chip ${len === (lengthsFor(s).includes(storyLen) ? storyLen : "short") ? "active" : ""}" data-len="${len}">${LENGTHS[len]}</button>`).join("")
    }</div>` : ""}
    <button class="narrate-btn" id="narrateBtn"><span class="ico">🔊</span><span id="narrateLabel">${t.listen}</span></button>
    ${pick(textFor(s, lengthsFor(s).includes(storyLen) ? storyLen : "short")).map(p => `<p>${p}</p>`).join("")}
    <div class="goodnight">${LANG_GOODNIGHT[lang] || t.goodnight}</div>`;
  document.getElementById("overlay").classList.add("open");
  reader.dataset.story = id;
  document.getElementById("overlay").scrollTop = 0;
}

function closeReader() {
  stopNarration();
  document.getElementById("overlay").classList.remove("open");
}

/* ---------- music: gentle classical lullaby playlist ---------- */
// All recordings are public domain (Wikimedia Commons) — free to use forever.
const PLAYLIST = [
  { file: "audio/brahms-lullaby.mp3",        title: "Brahms — Lullaby (Wiegenlied, Op. 49 No. 4)" },
  { file: "audio/gymnopedie-1.mp3",          title: "Satie — Gymnopédie No. 1" },
  { file: "audio/debussy-clair-de-lune.mp3", title: "Debussy — Clair de Lune" },
  { file: "audio/chopin-nocturne.mp3",       title: "Chopin — Nocturne Op. 9 No. 2" },
  { file: "audio/bach-air.mp3",              title: "Bach — Air on the G String" }
];
const music = document.getElementById("bgMusic");
music.volume = 0.35;
music.loop = false;                 // one piece flows into the next instead
let trackIdx = 0;

function loadTrack(i, autoplay) {
  trackIdx = (i + PLAYLIST.length) % PLAYLIST.length;
  music.src = PLAYLIST[trackIdx].file;
  if (autoplay) music.play().catch(() => {});
  updateMusicBtn();
}

function updateMusicBtn() {
  const t = UI[effLang()];
  const playing = !music.paused;
  const btn = document.getElementById("musicBtn");
  btn.classList.toggle("playing", playing);
  document.getElementById("musicLabel").textContent = playing ? t.musicPause : t.music;
  btn.title = PLAYLIST[trackIdx].title;   // hover shows the piece now playing
  const now = document.getElementById("nowPlaying");
  if (now) now.textContent = playing ? "♪ " + PLAYLIST[trackIdx].title : "";
}

// when a piece ends, drift softly into the next one
music.addEventListener("ended", () => loadTrack(trackIdx + 1, true));

document.getElementById("musicBtn").addEventListener("click", () => {
  if (music.paused) {
    // start on a different piece each night so bedtime never feels repetitive
    if (!music.src) loadTrack(Math.floor(Math.random() * PLAYLIST.length), false);
    music.play().then(updateMusicBtn).catch(updateMusicBtn);
  } else {
    music.pause();
    updateMusicBtn();
  }
});
music.addEventListener("play", updateMusicBtn);
music.addEventListener("pause", updateMusicBtn);

/* ---------- narration (read aloud) ---------- */
const synth = window.speechSynthesis;
let narrating = false;
let musicDucked = false;
let narrateTimer = null;
if (synth) { synth.getVoices(); synth.onvoiceschanged = () => synth.getVoices(); }

// Gentle bedtime voice styling per language.
// rate = slow & soothing; pitchBase/wave = soft sing-song rise & fall;
// gaps = little breathing pauses that give the reading a lullaby rhythm.
const VOICE_STYLE = {
  en: { rate: 0.70, pitchBase: 1.12, wave: 0.14, gapSentence: 480, gapPara: 780 },
  fr: { rate: 0.70, pitchBase: 1.12, wave: 0.14, gapSentence: 480, gapPara: 780 },
  sw: { rate: 0.82, pitchBase: 1.02, wave: 0.06, gapSentence: 360, gapPara: 620 }
};

// Prefer the warmest, most natural voice the device offers.
function pickVoice(code) {
  if (!synth) return null;
  const pref = { en: "en", sw: "sw", fr: "fr" }[code];
  const voices = synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(pref));
  if (!voices.length) return null;
  const natural = /google|natural|neural|premium|enhanced|siri/i;
  const warm = /female|samantha|ava|allison|serena|karen|moira|tessa|victoria|amelie|amélie|aurelie|aurélie|audrey|marie|julie|léa|lea/i;
  const scored = voices.map(v => {
    let s = 0;
    if (natural.test(v.name)) s += 5;
    if (warm.test(v.name)) s += 3;
    if (code === "en" && /en-US|en-GB/i.test(v.lang)) s += 1;
    if (code === "fr" && /fr-FR/i.test(v.lang)) s += 1;
    return { v, s };
  }).sort((a, b) => b.s - a.s);
  return scored[0].v;
}

/* Parent-voice recordings: audio/voice/{storyId}-{lang}.mp3 (generated in the Voice Studio).
   If a recording exists for this story+language it is preferred; otherwise we fall
   back to the browser's built-in read-aloud voice.

   Customer voice packs: opening the site as  ?voice=TOKEN  loads that family's audio
   from Supabase storage instead (see supabase/SETUP.md). */
const VOICEPACK_BASE = "https://yyvvbqggwkkncbistzzv.supabase.co/storage/v1/object/public/voicepacks";
const NARRATE_BASE = "https://yyvvbqggwkkncbistzzv.supabase.co/functions/v1";
const DEFAULT_VOICE_PACK = "";  // set to a pack token (e.g. Samuel's) to make a cloned voice the site default
const explicitVoiceParam = new URLSearchParams(location.search).get("voice");
const packToken = explicitVoiceParam || DEFAULT_VOICE_PACK;

/* Narrator picker (default site only; customer ?voice= links always use their own voice).
   Stock voices are generated on demand via the narrate function. */
/* Both stock voices are offered; spend is bounded by the per-IP daily cap in the
   narrate function, not by hiding voices. To limit to one voice again, drop the
   other from this object (and comment it out in supabase/functions/narrate/index.ts). */
const HOUSE_VOICES = { sarah: "Sarah", william: "William" };
let narrator = localStorage.getItem("narrator") || "sarah";
if (!HOUSE_VOICES[narrator]) narrator = "sarah";

/* Story lengths: every story has a ~2 min version (text); some also have
   textM (~5 min) and textL (~10 min). The reader shows a picker for what exists. */
const LENGTHS = { short: "⏱ 2 min", m: "5 min", l: "10 min" };
let storyLen = localStorage.getItem("storyLen") || "short";
/* 10-min ("l") disabled for the public trial to cap generation cost — add
   ...(s.textL ? ["l"] : [])  back to re-enable it (also re-enable "l" in the narrate function). */
const lengthsFor = s => ["short", ...(s.textM ? ["m"] : [])];
const textFor = (s, len) =>
  (len === "m" && s.textM) ? s.textM : (len === "l" && s.textL) ? s.textL : s.text;
const lenSuffix = len => len === "m" ? "-m" : len === "l" ? "-l" : "";
let packFiles = null;       // Set of "id-lang" keys available for this customer
if (packToken && VOICEPACK_BASE) {
  fetch(`${VOICEPACK_BASE}/${packToken}/manifest.json`)
    .then(r => r.ok ? r.json() : null)
    .then(m => { if (m && Array.isArray(m.files)) packFiles = new Set(m.files); })
    .catch(() => {});
}

const parentVoice = new Audio();
let parentVoicePlaying = false;
const voiceFileCache = new Map();
async function voiceFileFor(id, l) {
  const key = `${id}-${l}`;
  if (packToken && VOICEPACK_BASE) {
    const url = `${VOICEPACK_BASE}/${packToken}/${key}.mp3`;
    if (packFiles) return packFiles.has(key) ? url : null;
    // No manifest yet (pack still generating) — probe for the individual file.
    if (!voiceFileCache.has(key)) {
      try {
        const r = await fetch(url, { method: "HEAD" });
        voiceFileCache.set(key, r.ok ? url : null);
      } catch { voiceFileCache.set(key, null); }
    }
    return voiceFileCache.get(key);
  }
  if (!voiceFileCache.has(key)) {
    try {
      const r = await fetch(`audio/voice/${key}.mp3`, { method: "HEAD" });
      voiceFileCache.set(key, r.ok ? `audio/voice/${key}.mp3` : null);
    } catch { voiceFileCache.set(key, null); }
  }
  return voiceFileCache.get(key);
}
parentVoice.addEventListener("ended", () => stopNarration());

function stopNarration() {
  narrating = false;
  if (parentVoicePlaying) { parentVoice.pause(); parentVoice.currentTime = 0; parentVoicePlaying = false; }
  if (narrateTimer) { clearTimeout(narrateTimer); narrateTimer = null; }
  if (synth && (synth.speaking || synth.pending)) synth.cancel();
  document.querySelectorAll(".reader p.speaking").forEach(p => p.classList.remove("speaking"));
  const btn = document.getElementById("narrateBtn");
  if (btn) {
    btn.classList.remove("speaking");
    const lbl = document.getElementById("narrateLabel");
    if (lbl) lbl.textContent = UI[effLang()].listen;
  }
  if (musicDucked && !music.paused) music.volume = 0.35;
  musicDucked = false;
}

const PREPARING = { en: "Preparing the story…", sw: "Inaandaa hadithi…", fr: "Préparation de l'histoire…" };
const houseUrlCache = new Map();

// If a stock voice can't be generated (backend down, credits out), quietly fall back
// to the default narration path for this one play, keeping the user's chip selection.
function narratorFallback(storyId) {
  const saved = narrator;
  narrator = "samuel";
  Promise.resolve(startNarration()).finally(() => { narrator = saved; });
}

async function startNarration() {
  const storyId = document.getElementById("reader").dataset.story;
  const st = STORIES.find(x => x.id === storyId);
  const effLen = st && lengthsFor(st).includes(storyLen) ? storyLen : "short";

  // Stock narrator chosen (default site only): fetch/generate via the narrate function.
  if (!explicitVoiceParam && narrator !== "samuel" && storyId) {
    narrating = true;
    parentVoicePlaying = true;
    const btn = document.getElementById("narrateBtn");
    btn.classList.add("speaking");
    document.getElementById("narrateLabel").textContent = PREPARING[effLang()] || PREPARING.en;
    if (!music.paused) { music.volume = 0.07; musicDucked = true; }
    // Narrate the language actually on screen, so the child never hears one
    // language while reading another.
    const audioLang = (st && st.text?.[lang]) ? lang : effLang();
    const cacheKey = `${narrator}/${storyId}-${audioLang}${lenSuffix(effLen)}`;
    try {
      let url = houseUrlCache.get(cacheKey);
      if (!url) {
        const r = await fetch(`${NARRATE_BASE}/narrate`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ story: storyId, lang: audioLang, voice: narrator, length: effLen })
        });
        const j = await r.json();
        if (!r.ok || j.error) throw new Error(j.error || ("HTTP " + r.status));
        url = j.url;
        houseUrlCache.set(cacheKey, url);
      }
      if (!narrating) return;  // user pressed stop while we were preparing
      document.getElementById("narrateLabel").textContent = UI[effLang()].listenStop;
      parentVoice.src = url;
      parentVoice.play().catch(() => stopNarration());
    } catch (e) {
      console.warn("narrate failed, falling back to device voice:", e);
      stopNarration();
      narratorFallback(storyId);
    }
    return;
  }

  // Cloned-voice packs only exist for the 2-minute versions; longer versions
  // fall through to the built-in reader below.
  const recorded = (storyId && effLen === "short") ? await voiceFileFor(storyId, effLang()) : null;

  if (recorded) {
    narrating = true;
    parentVoicePlaying = true;
    const btn = document.getElementById("narrateBtn");
    btn.classList.add("speaking");
    document.getElementById("narrateLabel").textContent = UI[effLang()].listenStop;
    if (!music.paused) { music.volume = 0.07; musicDucked = true; }
    parentVoice.src = recorded;
    parentVoice.play().catch(() => { parentVoicePlaying = false; stopNarration(); });
    return;
  }

  if (!synth) { alert("Sorry, your browser can't read aloud."); return; }
  const paras = [...document.querySelectorAll(".reader p")];
  if (!paras.length) return;
  narrating = true;
  const btn = document.getElementById("narrateBtn");
  btn.classList.add("speaking");
  document.getElementById("narrateLabel").textContent = UI[effLang()].listenStop;
  if (!music.paused) { music.volume = 0.07; musicDucked = true; }

  const cfg = VOICE_STYLE[effLang()] || VOICE_STYLE.en;
  const voice = pickVoice(lang);
  const langTag = { en: "en-US", sw: "sw-KE", fr: "fr-FR" }[effLang()];

  // Break each paragraph into sentences so we can add gentle pauses and a
  // soft melodic pitch curve — the rhythm that captivates a small child.
  const queue = [];
  paras.forEach((p, pi) => {
    const parts = p.textContent.trim().split(/(?<=[.!?…])\s+/).filter(Boolean);
    (parts.length ? parts : [p.textContent.trim()]).forEach((sen, si) =>
      queue.push({ text: sen, p, pi, firstInPara: si === 0 }));
  });

  let qi = 0, lastPara = -1;
  const speakNext = () => {
    if (!narrating || qi >= queue.length) { stopNarration(); return; }
    const item = queue[qi];
    if (item.pi !== lastPara) {
      document.querySelectorAll(".reader p.speaking").forEach(x => x.classList.remove("speaking"));
      item.p.classList.add("speaking");
      item.p.scrollIntoView({ block: "center", behavior: "smooth" });
      lastPara = item.pi;
    }
    const u = new SpeechSynthesisUtterance(item.text);
    u.lang = langTag;
    if (voice) u.voice = voice;
    u.rate = cfg.rate;
    u.volume = 1;
    // soft rise-and-fall so it sings a little instead of droning
    u.pitch = Math.max(0.6, cfg.pitchBase + cfg.wave * Math.sin(qi * 0.9));
    u.onend = () => {
      qi++;
      const gap = (queue[qi] && queue[qi].firstInPara) ? cfg.gapPara : cfg.gapSentence;
      narrateTimer = setTimeout(speakNext, narrating ? gap : 0);
    };
    u.onerror = () => { qi++; narrateTimer = setTimeout(speakNext, 0); };
    synth.speak(u);
  };
  speakNext();
}

function fbCapture() {

/* ---------- search ---------- */
document.getElementById("searchInput").addEventListener("input", e => {
  searchQuery = e.target.value.trim();
  render();
});
document.getElementById("searchClear").addEventListener("click", () => {
  searchQuery = "";
  render();
  document.getElementById("searchInput").focus();
});
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Escape" && searchQuery) { e.stopPropagation(); searchQuery = ""; render(); }
});

/* ---------- events (delegated) ---------- */
document.addEventListener("click", e => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { lang = langBtn.dataset.lang; render(); return; }

  const star = e.target.closest(".fb-star");
  if (star) {
    fbCapture();
    fbRating = +star.dataset.star;
    document.querySelectorAll("#fbStars .fb-star").forEach(b =>
      b.classList.toggle("on", +b.dataset.star <= fbRating));
    return;
  }
  if (e.target.closest("#fbSend")) { submitFeedback(); return; }

  if (e.target.closest("#narrateBtn")) {
    if (narrating) stopNarration(); else startNarration();
    return;
  }

  const readerLang = e.target.closest("[data-reader-lang]");
  if (readerLang) {
    stopNarration();
    lang = readerLang.dataset.readerLang;
    render();
    openReader(document.getElementById("reader").dataset.story);
    return;
  }

  const lenBtn = e.target.closest("[data-len]");
  if (lenBtn) {
    stopNarration();
    storyLen = lenBtn.dataset.len;
    try { localStorage.setItem("storyLen", storyLen); } catch {}
    openReader(document.getElementById("reader").dataset.story);
    return;
  }

  const narrBtn = e.target.closest("[data-narrator]");
  if (narrBtn) {
    stopNarration();
    narrator = narrBtn.dataset.narrator;
    try { localStorage.setItem("narrator", narrator); } catch {}
    document.querySelectorAll("[data-narrator]").forEach(b =>
      b.classList.toggle("active", b.dataset.narrator === narrator));
    return;
  }

  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.kind === "region") regionFilter = chip.dataset.key;
    else if (chip.dataset.kind === "gender") genderFilter = chip.dataset.key;
    else topicFilter = chip.dataset.key;
    render(); return;
  }

  const card = e.target.closest("[data-story]");
  if (card && !e.target.closest(".reader")) { openReader(card.dataset.story); return; }

  if (e.target.id === "closeReader" || e.target.id === "overlay") closeReader();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

render();
</script>
