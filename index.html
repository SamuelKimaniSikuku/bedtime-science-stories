/* ---------- state ---------- */
let lang = "en";
let regionFilter = "all";
let topicFilter = "all";

/* ---------- stars ---------- */
(function makeStars() {
  const holder = document.getElementById("stars");
  for (let i = 0; i < 70; i++) {
    const s = document.createElement("div");
    s.className = "star";
    const size = 1 + (i % 3);
    s.style.width = s.style.height = size + "px";
    s.style.left = ((i * 37) % 100) + "%";
    s.style.top = ((i * 53) % 100) + "%";
    s.style.animationDelay = ((i * 0.13) % 3) + "s";
    holder.appendChild(s);
  }
})();

/* ---------- rendering ---------- */
function chipHtml(key, label, active, kind) {
  return `<button class="chip ${active ? "active" : ""}" data-kind="${kind}" data-key="${key}">${label}</button>`;
}

function render() {
  const t = UI[lang];
  document.documentElement.lang = lang;
  document.getElementById("siteTitle").textContent = t.title;
  document.getElementById("siteSubtitle").textContent = t.subtitle;
  document.getElementById("regionLabel").textContent = t.region;
  document.getElementById("topicLabel").textContent = t.topic;
  document.getElementById("footerLine").textContent = t.footer;

  document.getElementById("langSwitch").innerHTML = ["en", "sw", "fr"].map(l =>
    `<button class="lang-btn ${l === lang ? "active" : ""}" data-lang="${l}">${{en:"English",sw:"Kiswahili",fr:"Français"}[l]}</button>`
  ).join("");

  document.getElementById("regionChips").innerHTML =
    chipHtml("all", t.all, regionFilter === "all", "region") +
    Object.keys(REGIONS).map(k => chipHtml(k, REGIONS[k][lang], regionFilter === k, "region")).join("");

  document.getElementById("topicChips").innerHTML =
    chipHtml("all", t.all, topicFilter === "all", "topic") +
    Object.keys(TOPICS).map(k => chipHtml(k, `${TOPICS[k].emoji} ${TOPICS[k][lang]}`, topicFilter === k, "topic")).join("");

  const visible = STORIES.filter(s =>
    (regionFilter === "all" || s.region === regionFilter) &&
    (topicFilter === "all" || s.topic === topicFilter)
  );

  document.getElementById("countLine").textContent = t.showing(visible.length);

  const grid = document.getElementById("grid");
  grid.innerHTML = visible.length === 0
    ? `<div class="empty">${t.empty}</div>`
    : visible.map(s => `
      <div class="card" data-story="${s.id}">
        <div class="card-top">
          <div class="avatar">${s.emoji}</div>
          <div>
            <h2>${s.name}</h2>
            <div class="years">${s.years} · ${s.country[lang]}</div>
          </div>
        </div>
        <div class="card-title">${s.title[lang]}</div>
        <div class="hook">${s.hook[lang]}</div>
        <div class="badges">
          <span class="badge region-${s.region}">${REGIONS[s.region][lang]}</span>
          <span class="badge topic">${TOPICS[s.topic].emoji} ${TOPICS[s.topic][lang]}</span>
        </div>
        <div class="read-hint">${t.read}</div>
      </div>`).join("");
}

function openReader(id) {
  const s = STORIES.find(x => x.id === id);
  if (!s) return;
  const t = UI[lang];
  const reader = document.getElementById("reader");
  reader.innerHTML = `
    <button class="close-btn" id="closeReader" aria-label="Close">✕</button>
    <div class="reader-langs">${["en","sw","fr"].map(l =>
      `<button class="lang-btn ${l === lang ? "active" : ""}" data-reader-lang="${l}">${{en:"EN",sw:"SW",fr:"FR"}[l]}</button>`).join("")}
    </div>
    <div class="avatar">${s.emoji}</div>
    <h2>${s.name}</h2>
    <div class="story-title">${s.title[lang]}</div>
    <div class="meta">${s.years} · ${t.born} ${s.country[lang]}</div>
    <div class="badges">
      <span class="badge region-${s.region}">${REGIONS[s.region][lang]}</span>
      <span class="badge topic">${TOPICS[s.topic].emoji} ${TOPICS[s.topic][lang]}</span>
    </div>
    ${s.text[lang].map(p => `<p>${p}</p>`).join("")}
    <div class="goodnight">${t.goodnight}</div>`;
  document.getElementById("overlay").classList.add("open");
  reader.dataset.story = id;
  document.getElementById("overlay").scrollTop = 0;
}

function closeReader() {
  document.getElementById("overlay").classList.remove("open");
}

/* ---------- events (delegated) ---------- */
document.addEventListener("click", e => {
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) { lang = langBtn.dataset.lang; render(); return; }

  const readerLang = e.target.closest("[data-reader-lang]");
  if (readerLang) {
    lang = readerLang.dataset.readerLang;
    render();
    openReader(document.getElementById("reader").dataset.story);
    return;
  }

  const chip = e.target.closest(".chip");
  if (chip) {
    if (chip.dataset.kind === "region") regionFilter = chip.dataset.key;
    else topicFilter = chip.dataset.key;
    render(); return;
  }

  const card = e.target.closest("[data-story]");
  if (card && !e.target.closest(".reader")) { openReader(card.dataset.story); return; }

  if (e.target.id === "closeReader" || e.target.id === "overlay") closeReader();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeReader(); });

render();
</script>
