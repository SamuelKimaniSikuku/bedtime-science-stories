    fr: [
      "Dans une ville universitaire toute verte appelée <strong>Nsukka</strong>, au Nigéria, une fille nommée Chimamanda apprit à lire avant l'âge de quatre ans. Elle aimait les livres plus que presque tout au monde.",

  text: {

      "More than sixteen hundred years ago, in <strong>North Africa</strong> — in the land we now call Algeria — a boy named Augustine was born. The sun was hot, the olive trees were dusty, and Augustine was clever, funny, and never, ever still.",
      "He was a <strong>restless</strong> boy. One night he and his friends shook a neighbour's pear tree and took all the pears — not because they were hungry, but just for mischief. Many years later he still remembered it, and it made him think hard about why people sometimes do silly things. His mother, <strong>Monica</strong>, was endlessly patient with him. She waited, and hoped, and never stopped loving him.",

      "Il y a plus de mille six cents ans, en <strong>Afrique du Nord</strong> — dans le pays que nous appelons aujourd'hui l'Algérie — naquit un garçon nommé Augustin. Le soleil était brûlant, les oliviers étaient poussiéreux, et Augustin était malin, drôle, et jamais tranquille une seconde.",
      "C'était un garçon <strong>agité</strong>. Une nuit, ses amis et lui secouèrent le poirier d'un voisin et emportèrent toutes les poires — non pas parce qu'ils avaient faim, mais juste pour faire des bêtises. Bien des années plus tard, il s'en souvenait encore, et cela le fit longuement réfléchir : pourquoi les gens font-ils parfois des sottises ? Sa mère, <strong>Monique</strong>, fut infiniment patiente avec lui. Elle attendit, elle espéra, et jamais elle ne cessa de l'aimer.",

  title: {"en":"The Quiet Girl Who Found Her Voice","sw":"Msichana Mnyamavu Aliyeipata Sauti Yake","fr":"La petite fille silencieuse qui a retrouvé sa voix"},
  hook: {"en":"For five years she said nothing. Then the whole world listened.","sw":"Kwa miaka mitano hakusema neno. Kisha dunia nzima ikamsikiliza.","fr":"Pendant cinq ans, elle n'a rien dit. Puis le monde entier l'a écoutée."},
  text: {
    en: [
      "Maya Angelou was born in the United States and grew up with her grandmother in a small town with a dusty road and a little shop. When she was very young, something so <strong>sad</strong> happened that she stopped speaking. For almost five whole years, she did not say a word out loud.",
      "But a quiet child is not an empty child. Maya <strong>listened</strong> to everything: the birds outside the window, the rain on the roof, the way grown-ups sang when they thought no one could hear. And she read. She read nearly every book in the library, and the words gathered inside her like water behind a wall.",
      "Then a kind neighbour called Mrs. Flowers invited her in, gave her sweet biscuits, and read <strong>poetry</strong> aloud to her. She told Maya that poetry only truly lives when a human voice speaks it. Little by little, Maya opened her mouth again. Her voice came back, and it was rich and warm and deep.",
      "She grew up to be one of the world's great <strong>poets</strong>. She wrote a famous book called 'I Know Why the Caged Bird Sings', and one bright cold morning she stood before a whole country and read her poem at a president's inauguration. The girl who once said nothing had become a voice the world leaned in to hear."
    ],
    sw: [
      "Maya Angelou alizaliwa nchini Marekani na alilelewa na bibi yake katika mji mdogo wenye barabara ya vumbi na duka dogo. Alipokuwa mdogo sana, jambo la <strong>huzuni</strong> kubwa lilimtokea hata akaacha kuongea. Kwa karibu miaka mitano mizima, hakusema neno kwa sauti.",
      "Lakini mtoto mnyamavu si mtoto mtupu. Maya <strong>alisikiliza</strong> kila kitu: ndege nje ya dirisha, mvua juu ya paa, na jinsi watu wazima walivyoimba wakidhani hakuna anayewasikia. Na alisoma. Alisoma karibu kila kitabu kilichokuwa maktaba, na maneno yakakusanyika ndani yake kama maji nyuma ya ukuta.",
      "Kisha jirani mwema aliyeitwa Bi. Flowers akamkaribisha nyumbani kwake, akampa biskuti tamu, na akamsomea <strong>mashairi</strong> kwa sauti. Alimwambia Maya kwamba shairi huishi kikweli tu linapotamkwa na sauti ya mwanadamu. Polepole, Maya akafungua kinywa chake tena. Sauti yake ikarudi, ikiwa nzito, tamu na yenye joto.",
      "Alikua na kuwa mmoja wa <strong>washairi</strong> wakubwa duniani. Aliandika kitabu maarufu kiitwacho 'I Know Why the Caged Bird Sings', na asubuhi moja yenye baridi na jua alisimama mbele ya nchi nzima akasoma shairi lake kwenye sherehe ya kuapishwa kwa rais. Msichana yule aliyekuwa hasemi neno alikuwa sauti ambayo dunia iliinama ili kuisikiliza."
    ],
    fr: [
      "Maya Angelou est née aux États-Unis et a grandi chez sa grand-mère, dans une petite ville avec une route poussiéreuse et une petite boutique. Quand elle était toute petite, quelque chose de si <strong>triste</strong> est arrivé qu'elle a cessé de parler. Pendant presque cinq années entières, elle n'a pas dit un mot à voix haute.",
      "Mais un enfant silencieux n'est pas un enfant vide. Maya <strong>écoutait</strong> tout : les oiseaux derrière la fenêtre, la pluie sur le toit, la façon dont les grandes personnes chantaient en croyant que personne ne les entendait. Et elle lisait. Elle a lu presque tous les livres de la bibliothèque, et les mots s'amassaient en elle comme l'eau derrière un mur.",
      "Puis une gentille voisine, Madame Flowers, l'a invitée chez elle, lui a offert des biscuits sucrés et lui a lu de la <strong>poésie</strong> à voix haute. Elle a dit à Maya qu'un poème ne vit vraiment que lorsqu'une voix humaine le prononce. Peu à peu, Maya a rouvert la bouche. Sa voix est revenue, chaude, profonde et belle.",
      "Elle est devenue l'une des plus grandes <strong>poétesses</strong> du monde. Elle a écrit un livre célèbre, 'I Know Why the Caged Bird Sings', et un matin clair et froid elle s'est tenue devant tout un pays pour lire son poème à l'investiture d'un président. La petite fille qui ne disait rien était devenue une voix que le monde entier se penchait pour écouter."
    ]
  }

  text: {
    en: [
      "Long ago, in a little town called <strong>Porbandar</strong> beside the sea in India, a baby boy was born. His name was Mohandas Gandhi. He was such a <strong>shy</strong> little boy that when school finished he ran all the way home, so he would not have to talk to anybody.",
      "When he grew up he sailed far away to London to learn about the law. Then he went to work in South Africa. One night he was put off a train, out into the cold, only because of the colour of his <strong>skin</strong>. Sitting alone on that dark platform, he made himself a quiet promise. He would stand up to everything that was <strong>unfair</strong> — but he would never hurt anybody to do it.",
      "Back home in India, he showed millions of people how to be brave without fighting. He called it holding on to the truth: <strong>satyagraha</strong>. When the rulers said Indians could not even make their own salt, Gandhi simply started walking. He walked for weeks, all the way to the sea, and thousands of people walked with him. There he bent down and lifted a little <strong>salt</strong> from the shore, and the whole world was watching.",
      "Gandhi spun his own cloth on a small wooden wheel and owned almost nothing at all. People loved him so much that they called him <strong>Bapu</strong>, which means father. India became free. And Gandhi left us an idea soft enough for bedtime: being <strong>gentle</strong> can be stronger than being loud or rough."
    ],
    sw: [
      "Zamani sana, katika mji mdogo uitwao <strong>Porbandar</strong> ufukweni mwa bahari nchini India, alizaliwa mtoto wa kiume. Jina lake lilikuwa Mohandas Gandhi. Alikuwa mtoto mwenye <strong>haya</strong> sana. Shule ilipoisha, alikimbia hadi nyumbani ili asilazimike kuzungumza na mtu yeyote.",
      "Alipokua, alisafiri mbali hadi London kusoma sheria. Kisha akaenda kufanya kazi Afrika Kusini. Usiku mmoja alishushwa kwenye treni, akaachwa kwenye baridi, kwa sababu tu ya rangi ya <strong>ngozi</strong> yake. Akiwa peke yake kwenye kituo kile chenye giza, aliahidi moyoni mwake. Angepinga kila jambo lisilo la <strong>haki</strong> — lakini asingemdhuru mtu yeyote.",
      "Aliporudi India, aliwafundisha mamilioni ya watu jinsi ya kuwa hodari bila kupigana. Aliiita njia hiyo <strong>satyagraha</strong>, yaani kushikamana na ukweli. Watawala waliposema Wahindi hawaruhusiwi kutengeneza chumvi yao wenyewe, Gandhi alianza tu kutembea. Alitembea kwa majuma mengi hadi baharini, na maelfu ya watu wakatembea naye. Huko aliinama na kuokota <strong>chumvi</strong> kidogo ufukweni, na dunia nzima ikatazama.",
      "Gandhi alisokota nguo zake mwenyewe kwa gurudumu dogo la mbao, wala hakuwa na mali karibu yoyote. Watu walimpenda mno hata wakamwita <strong>Bapu</strong>, maana yake baba. India ikapata uhuru. Naye Gandhi akatuachia wazo zuri la wakati wa kulala: <strong>upole</strong> waweza kuwa na nguvu kuliko ukali."
    ],
    fr: [
      "Il y a bien longtemps, dans une petite ville au bord de la mer, en Inde, naquit un petit garçon. La ville s'appelait <strong>Porbandar</strong> et le bébé s'appelait Mohandas Gandhi. Il était si <strong>timide</strong> qu'à la fin de l'école il courait jusqu'à la maison pour n'avoir à parler à personne.",
      "Devenu grand, il partit très loin, à Londres, pour étudier le droit. Puis il alla travailler en Afrique du Sud. Une nuit, on le fit descendre d'un train, dehors, dans le froid, seulement à cause de la couleur de sa <strong>peau</strong>. Seul sur ce quai sombre, il se fit une promesse toute calme : il lutterait contre tout ce qui est <strong>injuste</strong>, mais sans jamais faire de mal à personne.",
      "De retour en Inde, il montra à des millions de gens comment être courageux sans se battre. Il appelait cela <strong>satyagraha</strong> : tenir bon avec la vérité. Quand on interdit aux Indiens de fabriquer leur propre sel, Gandhi se mit simplement à marcher. Il marcha des semaines, jusqu'à la mer, et des milliers de personnes marchèrent avec lui. Là, il se pencha et ramassa un peu de <strong>sel</strong> sur la plage, et le monde entier regarda.",
      "Gandhi filait lui-même son tissu sur un petit rouet en bois et ne possédait presque rien. Les gens l'aimaient tant qu'ils l'appelaient <strong>Bapu</strong>, ce qui veut dire papa. L'Inde devint libre. Et Gandhi nous a laissé une idée toute douce pour la nuit : la <strong>douceur</strong> peut être plus forte que la force."
    ]

  text: {
    en: [
      "In the beautiful city of <strong>Vienna</strong>, in Austria, there lived a curious little boy named Viktor Frankl. While other children counted sheep, Viktor lay in his bed asking enormous <strong>questions</strong>. Why are we here? What makes a life matter?",
      "He grew up to become a doctor — not a doctor of tummies or bones, but a doctor of the <strong>mind</strong> and the heart. People came to him feeling sad and lost, and Viktor listened to every one of them. He helped each person find one small <strong>reason</strong> to keep going, and slowly the heaviness lifted.",

      "When it was all over, Viktor wrote a small book called 'Man's Search for Meaning'. In it he gave the world his gift: nobody can ever take away your last freedom, the freedom to <strong>choose</strong> how you answer whatever happens to you. Even on the darkest night, he said, we can still choose <strong>hope</strong>."

    sw: [

    ],
    fr: [
      "Dans la belle ville de <strong>Vienne</strong>, en Autriche, vivait un petit garçon très curieux : Viktor Frankl. Pendant que les autres enfants comptaient les moutons, Viktor, dans son lit, se posait d'immenses <strong>questions</strong>. Pourquoi sommes-nous là ? Qu'est-ce qui donne du sens à une vie ?",
      "En grandissant, il devint médecin — non pas des ventres ni des os, mais de l'<strong>esprit</strong> et du cœur. Des gens venaient le voir, tristes et perdus, et Viktor les écoutait, tous. Il aidait chacun à trouver une petite <strong>raison</strong> de continuer, et peu à peu la tristesse s'allégeait.",
      "Puis vint en Europe un temps très <strong>cruel</strong>. Viktor et sa famille furent emmenés loin de chez eux, et il perdit presque tous ceux qu'il aimait. Même pendant ces années sombres, Viktor continua d'observer et de réfléchir. Il remarqua une chose vraie et toute simple : ceux qui gardaient un <strong>but</strong> — quelqu'un qui les attendait, un travail à terminer, une chanson encore à chanter — trouvaient la force de tenir.",
      "Quand tout fut fini, Viktor écrivit un petit livre : 'Découvrir un sens à sa vie'. Il y offrit son cadeau au monde : personne ne peut nous enlever notre dernière liberté, celle de <strong>choisir</strong> comment nous répondons à ce qui nous arrive. Même dans la nuit la plus noire, disait-il, on peut encore choisir l'<strong>espoir</strong>."

  text: {
    en: [
      "Anne Frank was born in Germany, and when she was very small her family moved to <strong>Amsterdam</strong>, a city full of canals and bicycles. Anne was funny and <strong>chatty</strong> — she talked so much in class that her teacher gave her the nickname Miss Quack-Quack. She loved cats, film stars and, most of all, books.",

    ],
    fr: [
      "Anne Frank est née en Allemagne, et toute petite, sa famille est partie vivre à <strong>Amsterdam</strong>, une ville pleine de canaux et de bicyclettes. Anne était drôle et très <strong>bavarde</strong> — elle parlait tellement en classe que son maître l'avait surnommée Mademoiselle Coin-Coin. Elle aimait les chats, les vedettes de cinéma et, par-dessus tout, les livres.",
      "Pour ses treize ans, elle reçut un petit carnet à couverture rouge et blanche, à carreaux. C'était le plus beau des cadeaux. Anne donna un nom à son <strong>journal</strong>, Kitty, et lui écrivit presque chaque jour, exactement comme à sa meilleure <strong>amie</strong>.",
      "Puis vint un temps cruel, et la famille d'Anne dut se <strong>cacher</strong>. Ils vécurent tout doucement dans quelques pièces secrètes au-dessus du bureau de son père, derrière une porte dissimulée par une bibliothèque, pendant deux années entières. Anne n'arrêta jamais d'écrire — les rires, les disputes, le fait de grandir, et son rêve de devenir <strong>écrivaine</strong> un jour. Et elle écrivit une phrase que le monde entier retient encore : malgré tout, elle croyait toujours que les gens sont bons au fond de leur cœur.",

  text: {
    en: [
      "High up among the snowy mountains of <strong>Tibet</strong>, in a small farming village, a baby boy was born to a family who grew barley and looked after horses. When he was only two years old, wise old monks came looking for him. They said this little boy was the next <strong>Dalai Lama</strong>, and they carried him away to a palace with a thousand rooms.",
      "It was a very big home for a very small boy. He wore red robes and learned to sit still, but oh, he was <strong>curious</strong>. He took clocks and watches to pieces just to see how they ticked inside, though he could not always put them back together again. At night he pointed his <strong>telescope</strong> at the city far below, watching the little lights and wishing he could run about in the streets like other children.",

    fr: [

      "Long, long ago in Greece there was a small town called Chaeronea, with quiet streets and hills all around. A boy named <strong>Plutarch</strong> was born there. Other clever people left small towns for big cities. Plutarch stayed. 'If I leave,' he said with a smile, 'my little town would be one person <strong>smaller</strong>.'",

      "He watched the settlers look down at a sheet of paper, and the paper told them things. Sequoyah called those pages <strong>talking leaves</strong>. 'Why should the talking leaves be only for them?' he said. 'My people must have them too.'",
      "For <strong>twelve years</strong> he listened to Cherokee and drew a mark for every sound. Neighbours laughed and said he was wasting his life. He kept going anyway. At last he had 85 signs, one for each sound in his language. To show that it worked, he asked his little daughter <strong>Ayokeh</strong> to read out loud a message he could not possibly have heard. She read it perfectly.",
      "Then the laughing stopped. In only a few years, thousands of Cherokee people could read and write their own language, and they printed their own <strong>newspaper</strong>. Sequoyah is the only person we know of who invented a whole writing system all by himself — and he did it for his <strong>mother tongue</strong>."
    ],
    sw: [
      "Katika <strong>Taifa la Cherokee</strong>, huko Marekani, aliishi fundi wa fedha aliyeitwa Sequoyah. Mikono yake ilitengeneza vitu vizuri sana kwa fedha. Lakini hakujua kusoma wala kuandika — hata neno moja, katika <strong>lugha</strong> yoyote duniani.",
      "Aliwatazama wageni wakiangalia karatasi, na karatasi ikiwaambia habari. Sequoyah aliyaita hayo makaratasi <strong>majani yanayoongea</strong>. 'Kwa nini majani yanayoongea yawe yao tu?' alijiuliza. 'Watu wangu nao wanastahili kuwa nayo.'",
      "Kwa <strong>miaka kumi na miwili</strong> alisikiliza lugha ya Kicherokee, akichora alama kwa kila sauti. Majirani walicheka wakisema anapoteza maisha yake. Yeye aliendelea tu. Mwishowe akapata alama 85, moja kwa kila sauti ya lugha yake. Ili kuonyesha kuwa zinafanya kazi, alimwomba binti yake mdogo <strong>Ayokeh</strong> asome kwa sauti ujumbe ambao asingeweza kuusikia. Aliusoma barabara.",
      "Ndipo vicheko vikakoma. Katika miaka michache tu, maelfu ya Wacherokee waliweza kusoma na kuandika lugha yao wenyewe, na wakachapisha <strong>gazeti</strong> lao. Sequoyah ndiye mtu pekee tunayemjua aliyebuni mfumo mzima wa maandishi peke yake — na alifanya hivyo kwa ajili ya <strong>lugha yake ya mama</strong>."
    ],
    fr: [
      "Dans la <strong>Nation Cherokee</strong>, en Amérique, vivait un orfèvre nommé Sequoyah. Ses mains fabriquaient de très jolies choses en argent. Mais il ne savait ni lire ni écrire — pas un seul mot, dans aucune <strong>langue</strong> du monde.",
      "Il regardait les colons poser les yeux sur une feuille de papier, et le papier leur racontait des choses. Sequoyah appelait ces pages des <strong>feuilles qui parlent</strong>. 'Pourquoi seraient-elles seulement pour eux ?' se disait-il. 'Mon peuple aussi doit en avoir.'",
      "Pendant <strong>douze ans</strong>, il écouta le cherokee et dessina un signe pour chaque son. Les voisins riaient et disaient qu'il perdait sa vie. Il continua quand même. Enfin il eut 85 signes, un par son de sa langue. Pour montrer que cela marchait, il demanda à sa petite fille <strong>Ayokeh</strong> de lire tout haut un message qu'il n'avait pas pu entendre. Elle le lut sans une seule erreur.",
      "Alors les rires s'arrêtèrent. En quelques années à peine, des milliers de Cherokees surent lire et écrire leur propre langue, et ils imprimèrent leur <strong>journal</strong>. Sequoyah est la seule personne connue à avoir inventé toute une écriture, tout seul — et il l'a fait pour sa <strong>langue maternelle</strong>."

  text: {

    fr: [
      "En <strong>France</strong>, un petit garçon appelé Jean-François apprit à lire tout seul, d'une drôle de façon. Il connaissait d'abord des textes par cœur, puis il les comparait aux signes du livre imprimé, jusqu'à ce que les signes veuillent enfin dire quelque <strong>chose</strong>. Personne ne le lui avait montré.",
      "À <strong>onze ans</strong>, un savant lui montra l'écriture de l'Égypte ancienne — de jolis petits dessins que plus personne sur Terre ne savait lire. Jean-François leva la tête et annonça tranquillement que ce serait lui qui les <strong>lirait</strong>.",

  text: {

      "Long, long ago, in a land called Greece, there lived a man named <strong>Aesop</strong>. He was born more than two thousand five hundred years ago. He was an <strong>enslaved</strong> man, which means he was not free. Some old writers said he came from Africa. Nobody knows for certain. His life is half history, half legend.",

  country: {"en":"France","sw":"Ufaransa","fr":"France"},
  title: {"en":"The Boy Who Made Fables Sing","sw":"Mvulana Aliyezifanya Hadithi Ziimbe","fr":"Le Garçon qui Fit Chanter les Fables"},
  hook: {"en":"A dreamy boy from the woods who made Aesop's animals sing in French.","sw":"Mvulana mwotaji wa msituni aliyewafanya wanyama wa Aesop waimbe kwa Kifaransa.","fr":"Un garçon rêveur des bois qui a fait chanter en français les animaux d'Ésope."},
  text: {
    en: [
      "In France, a long time ago, a boy named <strong>Jean de La Fontaine</strong> was born in a small town beside a great forest. He was supposed to sit still and study his books. Instead he wandered under the tall trees, watching birds and listening to the wind. The grown-ups shook their heads and called him a <strong>dreamer</strong>.",
      "But all that dreaming turned out to be useful. Jean watched real animals very closely: the way a <strong>fox</strong> tilts its head to listen, the way ants hurry along in a busy line, the way a crow shines blue-black in the sunshine. He remembered every small, true detail.",
      "Then he took Aesop's old animal tales and turned them into <strong>poems</strong> in French, so lovely that they sound like songs. In 'Le Corbeau et le Renard', a crow sits high in a tree with a fine piece of cheese in his beak. The fox below says, 'Oh, what beautiful feathers! Surely you sing beautifully too?' The proud crow opens his mouth to sing, and the <strong>cheese</strong> drops straight down to the waiting fox. Real foxes truly are clever: they can hear a mouse moving under the snow.",
      "Children in France still learn his poems <strong>by heart</strong>, hundreds of years later. Jean de La Fontaine gave Aesop's animals a new voice. He made animal wisdom <strong>sing</strong>."
    ],
    sw: [
      "Nchini Ufaransa, zamani sana, alizaliwa mvulana aliyeitwa <strong>Jean de La Fontaine</strong>, katika mji mdogo kando ya msitu mkubwa. Alipaswa kukaa kimya na kusoma vitabu vyake. Badala yake alitangatanga chini ya miti mirefu, akitazama ndege na kusikiliza upepo. Watu wazima walitikisa vichwa na kumwita <strong>mwotaji ndoto</strong>.",
      "Lakini ndoto zake zote zikawa na faida kubwa. Jean aliwatazama wanyama halisi kwa makini sana: jinsi <strong>mbweha</strong> anavyoinamisha kichwa kusikiliza, jinsi sisimizi wanavyoharakisha kwa mstari mmoja, jinsi kunguru anavyometa rangi ya buluu-nyeusi juani. Alikumbuka kila kitu kidogo cha kweli.",
      "Kisha akazichukua hadithi za zamani za wanyama za Aesop na kuzigeuza <strong>mashairi</strong> ya Kifaransa, mazuri hivi kwamba yanasikika kama nyimbo. Katika 'Kunguru na Mbweha', kunguru amekaa juu mtini na kipande kizuri cha jibini mdomoni. Mbweha aliye chini anasema, 'Lo, manyoya mazuri kama nini! Bila shaka waimba vizuri pia?' Kunguru mwenye kiburi anafungua mdomo kuimba, na <strong>jibini</strong> linadondoka moja kwa moja kwa mbweha aliyekuwa akisubiri. Mbweha wa kweli ni werevu kweli: wanaweza kusikia panya akitembea chini ya theluji.",
      "Watoto wa Ufaransa bado wanajifunza mashairi yake <strong>kwa moyo</strong>, mamia ya miaka baadaye. Jean de La Fontaine aliwapa wanyama wa Aesop sauti mpya. Aliifanya hekima ya wanyama <strong>iimbe</strong>."
    ],
    fr: [
      "En France, il y a très longtemps, un garçon nommé <strong>Jean de La Fontaine</strong> est né dans une petite ville au bord d'une grande forêt. Il aurait dû rester assis et étudier ses livres. Mais il préférait se promener sous les grands arbres, regarder les oiseaux et écouter le vent. Les grandes personnes secouaient la tête et le trouvaient bien <strong>rêveur</strong>.",
      "Ces rêveries ont pourtant beaucoup servi. Jean observait les vrais animaux de tout près : la façon dont un <strong>renard</strong> penche la tête pour écouter, dont les fourmis se pressent en file, dont le corbeau brille bleu-noir au soleil. Il se souvenait de chaque petit détail bien vrai.",
      "Puis il a repris les vieilles fables d'Ésope et les a transformées en <strong>poèmes</strong> français, si jolis qu'on dirait des chansons. Dans 'Le Corbeau et le Renard', un corbeau est perché tout en haut avec un beau fromage dans le bec. En bas, le renard lui dit : 'Oh, quelles belles plumes ! Vous chantez sûrement aussi bien ?' Le corbeau tout fier ouvre le bec pour chanter, et le <strong>fromage</strong> tombe droit chez le renard qui l'attendait. Les vrais renards sont vraiment rusés : ils entendent une souris bouger sous la neige.",
      "Les enfants de France apprennent encore ses poèmes <strong>par cœur</strong>, des centaines d'années plus tard. Jean de La Fontaine a donné une voix nouvelle aux animaux d'Ésope. Il a fait <strong>chanter</strong> la sagesse des bêtes."
    ]
  }
},
{
  id: "sewell", emoji: "🐴", name: "Anna Sewell", years: "1820–1878", born: 1820,

  title: {"en":"The Horse Who Told His Own Story","sw":"Farasi Aliyesimulia Hadithi Yake Mwenyewe","fr":"Le Cheval qui Raconta sa Propre Histoire"},
  hook: {"en":"She let a horse tell his own life story, and the whole world listened.","sw":"Alimwacha farasi asimulie hadithi ya maisha yake mwenyewe, na dunia nzima ikasikiliza.","fr":"Elle a laissé un cheval raconter sa propre vie, et le monde entier a écouté."},
  text: {
    en: [
      "<strong>Anna Sewell</strong> was born in England, in a house near the sea. When she was fourteen, she ran home in the rain, slipped, and hurt both her <strong>ankles</strong> badly. They never healed properly. After that day, she could not walk very far at all.",
      "So Anna went everywhere by <strong>horse</strong>. She drove her own little pony carriage, and she learned to guide her pony with her voice alone, hardly touching the reins. She could tell when a horse was tired, or worried, or happy. Horses became her closest friends in the world.",
      "But out on the roads she saw sad things: drivers whipping worn-out horses, and a hard strap called the bearing rein that forced a horse's head high until its neck ached. So Anna wrote a book called '<strong>Black Beauty</strong>', and she let the horse tell it himself, in his own voice. Black Beauty remembers his mother's gentle advice, the green meadow where he was a foal, the kind hands and the unkind ones. Real horses do remember: they know a kind voice for years and years.",
      "Anna wrote it lying on a couch, very ill, and she left us only a few months after the book appeared. She never knew it became one of the best-loved books ever written, or that it changed the <strong>law</strong> and made people gentler to horses everywhere."
    ],
    sw: [
      "<strong>Anna Sewell</strong> alizaliwa Uingereza, katika nyumba iliyo karibu na bahari. Alipokuwa na miaka kumi na minne, alikimbia nyumbani kwenye mvua, akateleza, na akaumia vibaya <strong>vifundo</strong> vyake vya miguu. Havikupona vizuri kamwe. Tangu siku ile, hakuweza kutembea mwendo mrefu hata kidogo.",
      "Kwa hiyo Anna alisafiri kila mahali kwa <strong>farasi</strong>. Aliendesha gari lake dogo la farasi, na akajifunza kumwongoza farasi wake kwa sauti tu, bila hata kuvuta hatamu. Aliweza kutambua farasi akiwa amechoka, au ameogopa, au ana furaha. Farasi wakawa rafiki zake wa karibu zaidi duniani.",
      "Lakini barabarani aliona mambo ya kuhuzunisha: madereva wakiwachapa farasi waliochoka, na ukanda mkali uliolazimisha kichwa cha farasi kubaki juu hadi shingo yake iume. Kwa hiyo Anna akaandika kitabu kiitwacho '<strong>Black Beauty</strong>', na akamwacha farasi mwenyewe asimulie kwa sauti yake. Black Beauty anakumbuka ushauri mpole wa mama yake, malisho ya kijani alikokulia, mikono ya wema na ile ya ukatili. Farasi wa kweli hukumbuka kweli: wanaikumbuka sauti ya upole kwa miaka na miaka.",
      "Anna aliandika akiwa amelala kitandani, mgonjwa sana, na akatuacha miezi michache tu baada ya kitabu kutoka. Hakuwahi kujua kwamba kikawa mojawapo ya vitabu vinavyopendwa zaidi duniani, wala kwamba kilibadilisha <strong>sheria</strong> na kuwafanya watu wawe wapole zaidi kwa farasi kila mahali."
    ],
    fr: [
      "<strong>Anna Sewell</strong> est née en Angleterre, dans une maison près de la mer. À quatorze ans, elle est rentrée en courant sous la pluie, elle a glissé et s'est gravement blessé les deux <strong>chevilles</strong>. Elles n'ont jamais bien guéri. Depuis ce jour, elle ne pouvait plus marcher très loin.",
      "Alors Anna allait partout à <strong>cheval</strong>. Elle conduisait sa petite voiture à poney et elle a appris à guider son poney rien qu'avec sa voix, sans presque toucher les rênes. Elle devinait quand un cheval était fatigué, inquiet ou heureux. Les chevaux sont devenus ses amis les plus proches.",
      "Mais sur les routes, elle voyait des choses tristes : des conducteurs qui fouettaient des chevaux épuisés, et une courroie dure qui forçait la tête du cheval à rester très haut jusqu'à lui faire mal au cou. Alors Anna a écrit un livre, '<strong>Black Beauty</strong>', et elle a laissé le cheval le raconter lui-même, avec sa propre voix. Black Beauty se souvient des conseils doux de sa maman, du pré vert de son enfance, des mains gentilles et des autres. Les vrais chevaux se souviennent : ils reconnaissent une voix douce pendant des années.",
      "Anna l'a écrit allongée sur un canapé, très malade, et elle nous a quittés quelques mois seulement après la sortie du livre. Elle n'a jamais su qu'il deviendrait l'un des livres les plus aimés du monde, ni qu'il changerait la <strong>loi</strong> et rendrait les gens plus doux avec les chevaux, partout."
    ]
  }
},
{
  id: "potter", emoji: "🐇", name: "Beatrix Potter", years: "1866–1943", born: 1866,
  region: "europe", topic: "animals", gender: "women",
  country: {"en":"England","sw":"Uingereza","fr":"Angleterre"},
  title: {"en":"The Girl and the Four Little Rabbits","sw":"Msichana na Sungura Wanne Wadogo","fr":"La Fillette et les Quatre Petits Lapins"},
  hook: {"en":"A quiet girl with a secret zoo upstairs who wrote about four little rabbits.","sw":"Msichana mtulivu mwenye zoo ya siri ghorofani aliyeandika kuhusu sungura wanne wadogo.","fr":"Une fillette discrète au zoo secret qui a écrit l'histoire de quatre petits lapins."},
  text: {
    en: [
      "<strong>Beatrix Potter</strong> grew up in a big, quiet house in London. She did not go to school. She learned at home, upstairs in the nursery. And up there she kept a secret little zoo: rabbits, mice, a <strong>hedgehog</strong>, frogs, and even a bat. Her pet rabbit Peter wore a small lead and went for walks with her.",
      "Beatrix drew them all, again and again, for hours and hours. She learned exactly how a rabbit's ear folds over, and how a mouse holds a crumb in both little paws. She also loved <strong>mushrooms</strong> and studied how they grow, painting hundreds of them. She was a real scientist, though in those days very few grown-ups would listen to a woman.",
      "One day she wrote a letter to a little boy who was ill. 'I shall tell you a story about four little <strong>rabbits</strong>, whose names were Flopsy, Mopsy, Cottontail and Peter,' she began, and she drew pictures all along the edges. That letter became '<strong>The Tale of Peter Rabbit</strong>', about a naughty rabbit who squeezes under a garden gate, loses his little blue jacket, and hurries home to his mother for a cup of warm herb tea.",
      "With the money her books earned, Beatrix bought farms and hills and flocks of sheep, and she gave the <strong>land</strong> away so that it would stay green forever. Her animals still feel alive on the page, because she truly <strong>knew</strong> them."
    ],
    sw: [
      "<strong>Beatrix Potter</strong> alikulia katika nyumba kubwa na tulivu jijini London. Hakwenda shule. Alifundishwa nyumbani, ghorofani katika chumba cha watoto. Na huko juu aliweka zoo yake ndogo ya siri: sungura, panya, <strong>kalunguyeye</strong>, vyura, na hata popo. Sungura wake kipenzi, Peter, alivaa kamba ndogo na kwenda matembezi pamoja naye.",
      "Beatrix aliwachora wote, tena na tena, kwa saa nyingi sana. Alijua hasa jinsi sikio la sungura linavyokunjika, na jinsi panya anavyoshika kombo la mkate kwa vitanga vyake viwili. Pia alipenda <strong>uyoga</strong> na akachunguza jinsi unavyoota, akichora mamia ya picha. Alikuwa mwanasayansi wa kweli, ingawa siku hizo watu wazima wachache sana walikuwa tayari kumsikiliza mwanamke.",
      "Siku moja alimwandikia barua mvulana mdogo aliyekuwa mgonjwa. 'Nitakusimulia hadithi ya <strong>sungura</strong> wanne wadogo, majina yao Flopsy, Mopsy, Cottontail na Peter,' alianza hivyo, na akachora picha pembezoni mwa barua yote. Barua ile ikawa kitabu '<strong>Hadithi ya Sungura Peter</strong>', kuhusu sungura mtundu anayejipenyeza chini ya lango la bustani, anapoteza koti lake dogo la buluu, na kukimbia nyumbani kwa mama yake kunywa chai ya moto ya mitishamba.",
      "Kwa fedha alizopata kutokana na vitabu vyake, Beatrix alinunua mashamba, vilima na makundi ya kondoo, kisha akaitoa <strong>ardhi</strong> ile ili ibaki ya kijani milele. Wanyama wake bado wanaonekana hai ukurasani, kwa sababu aliwajua <strong>kwelikweli</strong>."
    ],
    fr: [
      "<strong>Beatrix Potter</strong> a grandi dans une grande maison très calme à Londres. Elle n'allait pas à l'école. Elle apprenait chez elle, en haut, dans la chambre des enfants. Et là-haut, elle cachait un petit zoo secret : des lapins, des souris, un <strong>hérisson</strong>, des grenouilles et même une chauve-souris. Son lapin Peter portait une petite laisse et se promenait avec elle.",
      "Beatrix les dessinait tous, encore et encore, pendant des heures. Elle savait exactement comment se replie l'oreille d'un lapin, et comment une souris tient une miette entre ses deux petites pattes. Elle aimait aussi les <strong>champignons</strong> et étudiait leur façon de pousser, en en peignant des centaines. C'était une vraie scientifique, même si à l'époque très peu de grandes personnes écoutaient une femme.",
      "Un jour, elle a écrit une lettre à un petit garçon malade. 'Je vais te raconter l'histoire de quatre petits <strong>lapins</strong> qui s'appelaient Flopsy, Mopsy, Cottontail et Peter', commençait-elle, et elle dessinait tout autour des mots. Cette lettre est devenue '<strong>Pierre Lapin</strong>', l'histoire d'un lapin coquin qui se faufile sous la porte du jardin, perd sa petite veste bleue et rentre vite chez sa maman boire une tisane bien chaude.",
      "Avec l'argent de ses livres, Beatrix a acheté des fermes, des collines et des troupeaux de moutons, puis elle a offert ces <strong>terres</strong> pour qu'elles restent vertes pour toujours. Ses animaux semblent encore vivants sur la page, parce qu'elle les <strong>connaissait</strong> vraiment."
    ]
  }
},
{
  id: "fabre", emoji: "🦗", name: "Jean-Henri Fabre", years: "1823–1915", born: 1823,
  region: "europe", topic: "animals", gender: "men",
  country: {"en":"France","sw":"Ufaransa","fr":"France"},
  title: {"en":"The Man Who Listened to Insects","sw":"Mtu Aliyewasikiliza Wadudu","fr":"L'Homme qui Écoutait les Insectes"},
  hook: {"en":"He lay in the grass for years and turned tiny insects into heroes.","sw":"Alilala kwenye nyasi kwa miaka mingi na kuwafanya wadudu wadogo kuwa mashujaa.","fr":"Il s'est allongé dans l'herbe pendant des années et a fait des insectes de vrais héros."},
  text: {
    en: [
      "<strong>Jean-Henri Fabre</strong> was born in a poor farming village in the south of France. There were no toys, so the fields became his playground. He would lie in the <strong>grass</strong> for hours, his nose close to the ground, watching tiny things move. Once, as a very small boy, he shut his eyes and then his mouth, trying to work out which one he saw the sun with.",
      "He grew up and became a <strong>teacher</strong>, and he studied insects in a brand-new way. Other scientists pinned dead insects inside boxes. Fabre watched <strong>living</strong> ones instead, for years and years, in his own stony little garden. He gave that garden a name: the harmas.",
      "And what he saw there! A <strong>dung beetle</strong> rolling a ball bigger than himself, walking backwards, pushing with his strong back legs all the way home. A hunting wasp digging a neat burrow in the sand. A <strong>cicada</strong> singing in the hot afternoon; he has tiny drums in his sides, and he can sing loudly enough to fill a whole valley. Fabre wrote about them so warmly that people called him 'the insect's Homer'.",
      "Fabre showed us something simple and wonderful: watch one small creature long enough, and it becomes a whole <strong>world</strong>. So the next time an ant crosses your path, stop. Look closely. There is a <strong>story</strong> there."
    ],
    sw: [
      "<strong>Jean-Henri Fabre</strong> alizaliwa katika kijiji maskini cha wakulima kusini mwa Ufaransa. Hakukuwa na vifaa vya kuchezea, kwa hiyo mashamba yakawa uwanja wake wa michezo. Alilala kwenye <strong>nyasi</strong> kwa saa nyingi, pua yake karibu na ardhi, akitazama viumbe vidogo vikitembea. Siku moja akiwa mtoto mdogo sana, alifumba macho kisha akafumba mdomo, akijaribu kujua ni kipi kinachomwezesha kuliona jua.",
      "Alipokua akawa <strong>mwalimu</strong>, na akaanza kuwachunguza wadudu kwa njia mpya kabisa. Wanasayansi wengine walitundika wadudu waliokufa ndani ya masanduku. Fabre yeye aliwatazama walio <strong>hai</strong>, kwa miaka na miaka, katika bustani yake ndogo yenye mawe. Aliipa bustani ile jina: harmas.",
      "Na aliyoyaona huko! <strong>Mbawakawa</strong> wa mavi akiviringisha mpira mkubwa kuliko yeye mwenyewe, akitembea kinyumenyume, akiusukuma kwa miguu yake ya nyuma yenye nguvu hadi nyumbani. Nyigu wa kuwinda akichimba shimo nadhifu mchangani. <strong>Nyenje</strong> akiimba mchana wa joto; ana ngoma ndogo pembeni mwa mwili wake, na anaweza kuimba kwa sauti inayojaza bonde zima. Fabre aliandika juu yao kwa upendo mkubwa hata watu wakamwita 'mshairi wa wadudu'.",
      "Fabre alitufundisha jambo rahisi na la ajabu: mtazame kiumbe kimoja kidogo kwa muda mrefu, nacho kitakuwa <strong>ulimwengu</strong> mzima. Kwa hiyo wakati mwingine sisimizi atakapovuka njia yako, simama. Tazama kwa makini. Kuna <strong>hadithi</strong> hapo."
    ],
    fr: [
      "<strong>Jean-Henri Fabre</strong> est né dans un pauvre village de fermiers, dans le sud de la France. Il n'avait pas de jouets : les champs sont devenus son terrain de jeu. Il restait allongé dans l'<strong>herbe</strong> pendant des heures, le nez tout près du sol, à regarder bouger les toutes petites bêtes. Un jour, tout petit, il a fermé les yeux puis la bouche, pour deviner avec lequel des deux il voyait le soleil.",
      "En grandissant, il est devenu <strong>instituteur</strong>, et il a étudié les insectes d'une façon toute nouvelle. Les autres savants épinglaient des insectes morts dans des boîtes. Fabre, lui, observait les insectes <strong>vivants</strong>, pendant des années et des années, dans son petit jardin plein de cailloux. Il lui a donné un nom : l'harmas.",
      "Et ce qu'il y a vu ! Un <strong>bousier</strong> qui roule une boule plus grosse que lui, à reculons, en poussant de ses pattes arrière jusque chez lui. Une guêpe chasseresse qui creuse un terrier bien net dans le sable. Une <strong>cigale</strong> qui chante dans l'après-midi brûlant ; elle a de petits tambours sur les côtés du corps, et son chant peut remplir toute une vallée. Fabre en parlait avec tant de tendresse qu'on l'a appelé 'l'Homère des insectes'.",
      "Fabre nous a appris une chose simple et merveilleuse : regarde une petite bête assez longtemps, et elle devient un <strong>monde</strong> entier. Alors la prochaine fois qu'une fourmi traverse ton chemin, arrête-toi. Regarde bien. Il y a une <strong>histoire</strong> là."
    ]
  }
},
{
  id: "ebwhite", emoji: "🕷️", name: "E. B. White", years: "1899–1985", born: 1899,
  region: "americas", topic: "animals", gender: "men",
  country: {"en":"United States","sw":"Marekani","fr":"États-Unis"},
  title: {"en":"The Spider Who Could Write","sw":"Buibui Aliyejua Kuandika","fr":"L'araignée qui savait écrire"},
  hook: {"en":"He was too shy to speak in front of people — so he spoke to animals instead.","sw":"Alikuwa na haya sana kusema mbele ya watu — kwa hivyo alizungumza na wanyama badala yake.","fr":"Il était trop timide pour parler devant les gens — alors il parlait aux animaux."},
  text: {
    en: [
      "Long ago, in a big house in New York, lived a quiet boy named Elwyn. He was so <strong>shy</strong> that standing up to speak made his knees shake. But behind the house was a stable, warm and full of hay, and there he was never afraid. He talked to the horses. He watched the mice. Animals never asked him to make a speech.",
      "When he grew up, he bought a <strong>farm</strong> by the sea in Maine. He kept geese who honked at the gate, sheep with soft grey wool, and pigs in the barn. One morning he stopped in the barn doorway and saw a grey spider spinning something round and silky — an <strong>egg sac</strong>, full of hundreds of tiny babies waiting to hatch. He stood and watched for a very long time.",
      "Then a small runty piglet came to his farm, and he wished with all his heart that someone could save it. So he wrote a story. In <strong>'Charlotte's Web'</strong>, a little pig named Wilbur is in trouble — until a clever grey spider called <strong>Charlotte</strong> spins words right into her web. 'SOME PIG,' she writes. 'TERRIFIC.' Everyone comes to look, and nobody can bear to lose a pig so famous. E. B. White studied real spiders carefully, so Charlotte would spin and climb exactly as a true spider does.",
      "At the end, Charlotte grows old and tired, the way spiders do. But her babies hatch and float into the barn on tiny silk threads, and some of them stay with Wilbur forever. That is why children still read the book today: it says that a <strong>friend</strong> can change your whole life, and that the smallest creature in the barn — a spider in a corner — may be the most wonderful of all."
    ],
    sw: [
      "Zamani, katika nyumba kubwa huko New York, aliishi mvulana mtulivu aliyeitwa Elwyn. Alikuwa na <strong>haya</strong> nyingi kiasi kwamba akisimama kuzungumza magoti yake yalitetemeka. Lakini nyuma ya nyumba kulikuwa na zizi lenye joto na nyasi nyingi, na huko hakuogopa kamwe. Aliongea na farasi. Aliwatazama panya. Wanyama hawakumtaka atoe hotuba.",
      "Alipokua, alinunua <strong>shamba</strong> kando ya bahari huko Maine. Alifuga bata-bukini waliopiga kelele langoni, kondoo wenye sufu laini ya kijivu, na nguruwe zizini. Asubuhi moja alisimama mlangoni mwa zizi akamwona buibui wa kijivu akisokota kitu chenye duara na laini kama hariri — <strong>kifuko cha mayai</strong>, kilichojaa watoto wadogo mamia wakisubiri kuanguliwa. Alisimama akatazama kwa muda mrefu sana.",
      "Kisha nguruwe mdogo sana na dhaifu akafika shambani kwake, naye akatamani kwa moyo wote mtu fulani amwokoe. Kwa hivyo akaandika hadithi. Katika <strong>'Utando wa Charlotte'</strong>, nguruwe mdogo aitwaye Wilbur yuko hatarini — hadi buibui mjanja wa kijivu aitwaye <strong>Charlotte</strong> anaposokota maneno ndani ya utando wake. 'NGURUWE WA AJABU,' anaandika. 'MZURI KABISA.' Watu wote wanakuja kutazama, na hakuna anayeweza kumpoteza nguruwe maarufu hivyo. E. B. White aliwachunguza buibui halisi kwa makini, ili Charlotte asokote na kupanda kama buibui wa kweli.",
      "Mwishoni, Charlotte anazeeka na kuchoka, kama buibui wanavyofanya. Lakini watoto wake wanaanguliwa na kuelea hadi zizini kwa nyuzi nyembamba za hariri, na baadhi yao wanabaki na Wilbur milele. Ndiyo maana watoto bado wanasoma kitabu hiki leo: kinasema kwamba <strong>rafiki</strong> anaweza kubadilisha maisha yako yote, na kwamba kiumbe kidogo kabisa zizini — buibui pembeni — huenda ndiye wa ajabu kuliko wote."
    ],
    fr: [
      "Il y a longtemps, dans une grande maison de New York, vivait un garçon très calme appelé Elwyn. Il était si <strong>timide</strong> que ses genoux tremblaient quand il devait parler devant les autres. Mais derrière la maison il y avait une écurie, tiède et pleine de foin, et là il n'avait jamais peur. Il parlait aux chevaux. Il regardait les souris. Les animaux ne lui demandaient jamais de faire un discours.",
      "Devenu grand, il acheta une <strong>ferme</strong> au bord de la mer, dans le Maine. Il y élevait des oies qui criaient au portail, des moutons à la laine grise et douce, et des cochons dans la grange. Un matin, il s'arrêta sur le pas de la porte et vit une araignée grise filer quelque chose de rond et de soyeux — un <strong>cocon d'œufs</strong>, rempli de centaines de bébés qui attendaient d'éclore. Il resta là à regarder très longtemps.",
      "Puis un tout petit cochon, le plus faible de la portée, arriva à la ferme, et il souhaita de tout son cœur que quelqu'un puisse le sauver. Alors il écrivit une histoire. Dans <strong>'La toile de Charlotte'</strong>, un petit cochon nommé Wilbur est en danger — jusqu'à ce qu'une araignée grise très maligne, <strong>Charlotte</strong>, tisse des mots dans sa toile. 'QUEL COCHON', écrit-elle. 'FORMIDABLE.' Tout le monde vient regarder, et plus personne ne veut perdre un cochon aussi célèbre. E. B. White observa longuement de vraies araignées, pour que Charlotte tisse et grimpe exactement comme une vraie.",
      "À la fin, Charlotte devient vieille et fatiguée, comme les araignées le deviennent. Mais ses bébés éclosent et s'envolent dans la grange sur de minces fils de soie, et certains restent près de Wilbur pour toujours. C'est pour cela que les enfants lisent encore ce livre aujourd'hui : il dit qu'un <strong>ami</strong> peut changer toute une vie, et que la plus petite créature de la grange — une araignée dans un coin — est peut-être la plus merveilleuse de toutes."
    ]
  }

{

  title: {"en":"The Doctor Who Kept the Stories","sw":"Daktari Aliyehifadhi Hadithi","fr":"Le docteur qui a gardé les contes"},
  hook: {"en":"He saved a thousand animal tales by writing down what the old storytellers said.","sw":"Aliokoa hadithi elfu za wanyama kwa kuandika yale waliyosimulia wazee wasimuliaji.","fr":"Il a sauvé mille contes d'animaux en écrivant ce que disaient les conteurs."},
  text: {
    en: [
      "In Ouakam, a village near Dakar in <strong>Senegal</strong>, a boy named Birago sat close to his grandmother after the evening meal. The plates were cleared, the night was warm, and the stories began. Sometimes a <strong>griot</strong> came — a storyteller whose job is to remember everything a people knows, and to say it out loud so nobody forgets.",
      "Birago grew up and became a <strong>veterinary doctor</strong>, a doctor for animals. He travelled all across West Africa, caring for cattle with long curved horns, for goats and sheep and donkeys. And in every village where he stopped, he did one more thing: he listened. He asked the old people for their tales, and he wrote them down in his notebook before they could be forgotten.",
      "Then he made them into a book, <strong>'Les Contes d'Amadou Koumba'</strong>, named after the griot who taught him most. Inside live <strong>Leuk the hare</strong>, so clever he can trick anyone, and <strong>Bouki the hyena</strong>, so greedy he always wants the biggest share and always ends up with nothing. The animals argue and boast and share and forgive — and if you listen closely, they are really telling you about people, and about you.",
      "Birago also wrote a beautiful poem saying that those we love who have died are not truly gone: they are in the rustling tree, in the running water, in the wind on your face. He is remembered because he <strong>saved</strong> Africa's animal stories on paper, and showed the whole world that they are every bit as wise and as funny as any fable ever told."
    ],
    sw: [
      "Huko Ouakam, kijiji karibu na Dakar nchini <strong>Senegal</strong>, mvulana aitwaye Birago alikaa karibu na bibi yake baada ya chakula cha jioni. Sahani zilikuwa zimeondolewa, usiku ulikuwa na joto, na hadithi zilianza. Wakati mwingine alikuja <strong>griot</strong> — msimuliaji ambaye kazi yake ni kukumbuka kila kitu watu wanachojua, na kukisema kwa sauti ili mtu asisahau.",
      "Birago alikua akawa <strong>daktari wa wanyama</strong>. Alisafiri kote Afrika Magharibi, akiwahudumia ng'ombe wenye pembe ndefu zilizopinda, mbuzi, kondoo na punda. Na katika kila kijiji alikosimama, alifanya jambo moja zaidi: alisikiliza. Aliwaomba wazee hadithi zao, akaziandika katika daftari lake kabla hazijasahaulika.",
      "Kisha akazifanya kuwa kitabu, <strong>'Hadithi za Amadou Koumba'</strong>, kilichoitwa kwa jina la griot aliyemfundisha zaidi. Ndani wanaishi <strong>Leuk sungura</strong>, mjanja kiasi cha kumdanganya yeyote, na <strong>Bouki fisi</strong>, mlafi kiasi cha kutaka fungu kubwa kuliko wote na kuishia bila kitu. Wanyama wanabishana, wanajivuna, wanagawana na kusameheana — na ukisikiliza kwa makini, kwa kweli wanakusimulia kuhusu watu, na kuhusu wewe mwenyewe.",
      "Birago pia aliandika shairi zuri akisema kwamba wapendwa wetu waliofariki hawajaondoka kabisa: wako katika mti unaotikisika, katika maji yanayotiririka, katika upepo unaogusa uso wako. Anakumbukwa kwa sababu <strong>aliokoa</strong> hadithi za wanyama za Afrika kwenye karatasi, na akaonyesha ulimwengu mzima kwamba zina hekima na ucheshi sawa na hadithi yoyote iliyowahi kusimuliwa."
    ],
    fr: [
      "À Ouakam, un village près de Dakar au <strong>Sénégal</strong>, un garçon nommé Birago s'asseyait tout près de sa grand-mère après le repas du soir. Les plats étaient rangés, la nuit était douce, et les contes commençaient. Parfois un <strong>griot</strong> passait — un conteur dont le métier est de se souvenir de tout ce qu'un peuple sait, et de le dire à voix haute pour que personne n'oublie.",
      "Birago grandit et devint <strong>vétérinaire</strong>, un docteur pour les animaux. Il voyagea partout en Afrique de l'Ouest, soignant des vaches aux longues cornes recourbées, des chèvres, des moutons et des ânes. Et dans chaque village où il s'arrêtait, il faisait une chose de plus : il écoutait. Il demandait aux anciens leurs contes, et il les notait dans son carnet avant qu'ils ne s'effacent.",
      "Puis il en fit un livre, <strong>'Les Contes d'Amadou Koumba'</strong>, du nom du griot qui lui avait le plus appris. Dedans vivent <strong>Leuk le lièvre</strong>, si rusé qu'il peut tromper n'importe qui, et <strong>Bouki l'hyène</strong>, si gourmand qu'il veut toujours la plus grosse part et finit toujours sans rien. Les animaux se disputent, se vantent, partagent et pardonnent — et si tu écoutes bien, ils parlent en vérité des gens, et de toi.",
      "Birago écrivit aussi un très beau poème qui dit que ceux que nous aimons et qui sont partis ne sont pas vraiment partis : ils sont dans l'arbre qui frémit, dans l'eau qui coule, dans le vent sur ton visage. On se souvient de lui parce qu'il a <strong>sauvé</strong> les contes d'animaux de l'Afrique en les écrivant, et qu'il a montré au monde entier qu'ils sont aussi sages et aussi drôles que n'importe quelle fable."
    ],
    ki: [
      "Thĩinĩ wa gĩcagi kĩarĩ hakuhĩ na Dakar bũrũri-inĩ wa Senegal, kahĩĩ getagwo Birago aikarĩire hakuhĩ na cũcũ wao thutha wa irio cia hwaĩ-inĩ. Mĩtaro ĩyo nĩyathereririo, ũtukũ warĩ mũrugarĩ, na ng’ano cikĩambĩrĩria. Rĩmwe na rĩmwe nĩgũokĩre mwarĩa wa rũgano-mũndũ ũrĩa wĩĩra wake wa kũririkana maũndũ mothe andũ maramenya, na kũũga na mũgambo mũnene kogũo gũtĩrĩ mũndũ ũngĩrĩganĩrwo.",
      "Birago akũrĩire na agĩtuĩka ndagĩtarĩ wa nyamũ, ndagĩtarĩ wa nyamũ. Agereire kũndũ guothe Africa ya ithũĩro, akĩrora ng'ombe cirĩ na hĩa nyingĩ, mbũri, ng’ondu na ndigiri. Na itũra-inĩ o rĩothe harĩa arũgamĩte, agĩĩka ũndũ ũngĩ ũmwe: agĩthikĩrĩria.",
      "Nĩorĩrĩe andũ akũrũ ng'ano ciao, na akĩmaandĩka ibuku-inĩ rĩake mbere ya kũrĩganĩrwo. Agĩcoka akĩmathondekĩa ĩbũkũ ''Les Contes d'Amadou Koũmba'' rĩtwa rĩa mwarĩmũ ũrĩa wamũthomĩthĩrĩe mũno. Thĩinĩ wa Leuk ũrĩa ũĩkaĩne, no ahũthĩre mũndũ o wothe, na Bouki the hyena, koguo akoragwo na ũkoroku akĩenda igai inene rĩa gũthĩra hatarĩ kĩndũ.",
      "Nyamũ nĩcikararanagia na njĩra ya kũgayana na kuohanĩra – na ũngĩthikĩrĩria wega, nĩcirakwĩra ũhoro wa andũ, na ũhoro waku. Birago nĩandĩkire rĩrebeta rĩthaka rĩkĩũga atĩ arĩa twendete arĩa makuĩte matĩathĩra: marĩ mũtĩ-inĩ ũrĩa ũrĩ na maĩ-inĩ ma gũtengera, rũhuho-inĩ igũrũ rĩaku. Nĩarĩrĩkanwo tondũ nĩahonokirie ng'ano cia nyamũ cia Afrika iratathi-inĩ, na akĩonania thĩ yothe nĩ ĩrĩ na ũũgĩ mũingĩ na ĩthekanĩte ta ũrĩa mũndũ atarĩirio."

{
  id: "adamson", emoji: "🦁", name: "Joy Adamson", years: "1910–1980", born: 1910,
  region: "africa", topic: "animals", gender: "women",
  country: {"en":"Kenya","sw":"Kenya","fr":"Kenya"},
  title: {"en":"Elsa, the Lioness Who Went Free","sw":"Elsa, Simba Aliyerudi Porini","fr":"Elsa, la lionne rendue à la liberté"},
  hook: {"en":"She loved a lion cub so much that she taught her to live without her.","sw":"Alimpenda mtoto wa simba sana hata akamfundisha kuishi bila yeye.","fr":"Elle aimait tant un lionceau qu'elle lui apprit à vivre sans elle."},
  text: {
    en: [
      "Joy was born far away in Austria, in a land of snow and pine trees. Then she came to <strong>Kenya</strong>, and she never wanted to leave. She carried her paints everywhere, sitting quietly for hours to paint the faces of Kenya's peoples and the wild flowers that grow in the red soil. Her husband George was a game warden, whose work was looking after wild animals.",
      "One day three <strong>lion cubs</strong> with no mother came into their care. Two were sent to a zoo far away, but the smallest, softest one stayed. They called her <strong>Elsa</strong>. Elsa slept on their beds, rode in their car with her chin on the window, and chased Joy's shoelaces across the floor. She purred like a very large cat.",
      "But Joy believed a wild animal belongs in the wild. So she did the hardest, most loving thing. For months she took Elsa out into the bush and taught her, slowly, how to be a real <strong>lioness</strong> — how to walk softly, how to hunt, how to sleep in the shade of a thorn tree. Elsa was the first lioness raised by people ever to live free again. And one wonderful day she came padding back through the grass, bringing her own cubs to show them. Joy wrote her story in a book called <strong>'Born Free'</strong>.",
      "Joy's own life ended sadly in Kenya in 1980, and many people cried for her. But what she began did not stop. Because of Elsa, people all over the world began to see lions differently — not as things to keep, but as families with names and hearts. Joy taught us that real <strong>love</strong> sometimes means opening your hands and letting something run free."
    ],
    sw: [
      "Joy alizaliwa mbali huko Austria, katika nchi ya theluji na miti ya misonobari. Kisha akaja <strong>Kenya</strong>, na hakutaka kamwe kuondoka. Alibeba rangi zake kila mahali, akikaa kimya kwa masaa akichora nyuso za watu wa Kenya na maua ya porini yanayoota katika udongo mwekundu. Mumewe George alikuwa mlinzi wa wanyamapori, na kazi yake ilikuwa kuwatunza wanyama wa porini.",
      "Siku moja <strong>watoto watatu wa simba</strong> wasio na mama walifika mikononi mwao. Wawili walipelekwa mbugani mbali, lakini mdogo na mlaini kuliko wote alibaki. Wakamwita <strong>Elsa</strong>. Elsa alilala vitandani mwao, alisafiri nao garini akiegemea kidevu dirishani, na alifukuza kamba za viatu vya Joy sakafuni. Alilia kwa sauti tulivu kama paka mkubwa sana.",
      "Lakini Joy aliamini kwamba mnyama wa porini ni wa porini. Kwa hivyo alifanya jambo gumu zaidi na lenye upendo zaidi. Kwa miezi mingi alimpeleka Elsa nyikani na kumfundisha, taratibu, jinsi ya kuwa <strong>simba jike</strong> halisi — jinsi ya kutembea kimyakimya, jinsi ya kuwinda, jinsi ya kulala kwenye kivuli cha mti wa miiba. Elsa alikuwa simba jike wa kwanza aliyelelewa na watu kuwahi kurudi kuishi huru. Na siku moja ya ajabu alirudi akipita nyasini, akiwaleta watoto wake mwenyewe ili awaonyeshe. Joy aliandika hadithi yake katika kitabu kiitwacho <strong>'Born Free'</strong>, yaani 'Kuzaliwa Huru'.",
      "Maisha ya Joy yaliishia kwa huzuni nchini Kenya mwaka 1980, na watu wengi walimlilia. Lakini alichoanzisha hakikuishia hapo. Kwa sababu ya Elsa, watu duniani kote walianza kuwaona simba kwa namna mpya — si vitu vya kufuga, bali familia zenye majina na mioyo. Joy alitufundisha kwamba <strong>upendo</strong> wa kweli mara nyingine humaanisha kufungua mikono na kuachilia kitu kiende huru."
    ],
    fr: [
      "Joy est née très loin, en Autriche, dans un pays de neige et de sapins. Puis elle est venue au <strong>Kenya</strong>, et elle n'a plus jamais voulu partir. Elle emportait ses peintures partout, restant assise des heures en silence pour peindre les visages des peuples du Kenya et les fleurs sauvages qui poussent dans la terre rouge. Son mari George était garde-chasse : son travail était de veiller sur les animaux sauvages.",
      "Un jour, trois <strong>lionceaux</strong> sans maman leur furent confiés. Deux partirent dans un zoo lointain, mais la plus petite et la plus douce resta. Ils l'appelèrent <strong>Elsa</strong>. Elsa dormait sur leurs lits, voyageait en voiture le menton posé sur la vitre, et courait après les lacets de Joy à travers la pièce. Elle ronronnait comme un très, très grand chat.",
      "Mais Joy croyait qu'un animal sauvage appartient à la nature. Alors elle fit la chose la plus difficile et la plus aimante. Pendant des mois, elle emmena Elsa dans la brousse et lui apprit, doucement, à devenir une vraie <strong>lionne</strong> — marcher sans bruit, chasser, dormir à l'ombre d'un acacia. Elsa fut la première lionne élevée par des humains à retrouver vraiment la liberté. Et un jour merveilleux, elle revint à pas feutrés dans les hautes herbes, amenant ses propres petits pour les montrer. Joy raconta tout cela dans un livre : <strong>'Vivre libre'</strong>.",
      "La vie de Joy s'est achevée tristement au Kenya en 1980, et beaucoup de gens l'ont pleurée. Mais ce qu'elle avait commencé ne s'est pas arrêté. Grâce à Elsa, partout dans le monde on s'est mis à regarder les lions autrement — non comme des choses à garder, mais comme des familles avec des noms et un cœur. Joy nous a appris que le vrai <strong>amour</strong> veut parfois dire ouvrir les mains et laisser partir."
    ],
    ki: [
      "Joy aciarĩirwo kũraihu Austria, bũrũri-inĩ wa mbarabu na mĩtĩ ya pĩne. Agĩcoka agĩũka Kenya, na ndarĩ eendaga gũthiĩ Akuĩte rangi wake kũndũ guothe, aikarĩte mathaa maingĩ akirĩire kũhe andũ a Kenya ũthiũ na mahũa ma gĩthaka marĩa makũraga tĩri-inĩ mũtune. Mũthuuri wake George arĩ mũnene wa mũthako, ũrĩa wĩra wake warutaga nyamũ cia gĩthaka. Mũthenya ũmwe twana tũtatũ twa mĩrũthĩ tũtarĩ na nyĩna twakĩnyĩre kũmarora.",
      "Erĩ matũmirwo kũraihu na nyamũ cia nyamũ, no ĩrĩa nini mũno yaikarire na ĩrĩa hũthũ mũno. Makĩmwĩta Elsa. Elsa akomire marĩrĩ-inĩ mao, agĩtwarithia ngari-inĩ yao na kĩrerũ gĩake ndirica-inĩ, na akĩingata iratũ cia Joy thĩ. Athambire ta kanyau kanene mũno No joy etĩkĩtĩe nyamũ ya gĩthaka nĩ mũtĩtũ.",
      "Ekire ũndũ mũritũ mũno na wa wendo. Kwa ĩh ĩnda r ĩa m ĩer ĩ n ĩatũm ĩre Elsa g ĩthaka- ĩn ĩ ak ĩmũthom ĩth ĩa kahora. Elsa nĩwe warĩ mĩrũthĩ ya mbere kũrũmĩrĩrwo nĩ andũ gũtũra rĩngĩ. Na mũthenya ũmwe mwega okire agĩcoka nyeki-inĩ, akĩrehe twana twake kũmonia.",
      "Joy aandĩkire rũgano rwake ibuku-inĩ rĩtagwo 'Born Free'. Mũtũrĩre wa Joy wathirire mwaka-inĩ wa 1980, na andũ aingĩ nĩmamũrĩrĩire. No ũrĩa ambĩrĩirie ndatigire. Nĩ ũndũ wa Elsa, andũ kũndũ guothe thĩ yothe nĩmambĩrĩirie kuona mĩrũthi ĩtiganĩte – ti ta indo cia kũiga, no marĩ ta bamĩrĩ cina marĩtwa na ngoro. Gĩkeno gĩatũrutire atĩ wendo wa ma rĩmwe na rĩmwe nĩ kũhĩngũra moko na kũreka kĩndũ gĩthire."
    ]
  }

{
  id: "durrell", emoji: "🦎", name: "Gerald Durrell", years: "1925–1995", born: 1925,
  region: "europe", topic: "animals", gender: "men",
  country: {"en":"England / Greece","sw":"Uingereza na Ugiriki","fr":"Angleterre / Grèce"},
  title: {"en":"The Boy With a Net and a Jar","sw":"Mvulana Mwenye Wavu na Chupa","fr":"Le garçon au filet et au bocal"},
  hook: {"en":"He kept scorpions in matchboxes — and grew up to save animals from disappearing.","sw":"Aliweka nge katika visanduku vya kiberiti — kisha akakua akaokoa wanyama wasitoweke.","fr":"Il gardait des scorpions dans des boîtes d'allumettes — puis il sauva des espèces entières."},
  text: {
    en: [
      "When Gerald was a small boy, his family packed up and moved to <strong>Corfu</strong>, a sunny Greek island in a very blue sea. Instead of sitting in an ordinary classroom, he spent five whole years outdoors with a <strong>net</strong> in one hand and a jam jar in the other, and a kind tutor who let him study animals all day long.",
      "The house filled up with creatures. Tortoises walked slowly across the floor. An owl blinked from the top of a cupboard. Geckos with sticky toes ran up the walls at night. And once — just once — a mother <strong>scorpion</strong> he had hidden in a <strong>matchbox</strong> opened her box right at the dinner table, and all her tiny babies went marching over the tablecloth. His family shouted. Gerald thought it was wonderful. Years later he wrote it all down in a very funny book called <strong>'My Family and Other Animals'</strong>.",
      "When he grew up, Gerald had a new idea. He built a <strong>zoo</strong> on the island of Jersey, but not a zoo for showing animals off. His zoo was a safe nursery for the rarest animals in the world — the ones so few that they might vanish altogether. There they could have babies in peace, and then be carried back home to their own forests and islands.",
      "It worked. The <strong>pink pigeon</strong> of Mauritius, soft and rosy, was down to a handful of birds — and today it flies wild again. The golden lion tamarin, a little monkey with a mane like a tiny lion made of sunshine, was saved the same way. Gerald used his funny stories to pay for serious work. He showed that if you love animals enough to laugh with them, you will fight to <strong>keep</strong> them."
    ],
    sw: [
      "Gerald alipokuwa mvulana mdogo, familia yake ilihama na kwenda <strong>Korfu</strong>, kisiwa cha Ugiriki chenye jua kali katika bahari ya buluu sana. Badala ya kukaa darasani la kawaida, alitumia miaka mitano mizima nje akiwa na <strong>wavu</strong> mkono mmoja na chupa mkono mwingine, na mwalimu mpole aliyemruhusu kuwasoma wanyama mchana kutwa.",
      "Nyumba ilijaa viumbe. Kobe walitembea polepole sakafuni. Bundi alipepesa macho juu ya kabati. Mijusi wenye vidole vinavyonata walipanda ukutani usiku. Na mara moja — mara moja tu — <strong>nge</strong> mama aliyemficha katika <strong>kisanduku cha kiberiti</strong> alifungua kisanduku chake mezani wakati wa chakula, na watoto wake wote wadogo wakaanza kutembea juu ya kitambaa cha meza. Familia yake ilipiga kelele. Gerald aliona ni jambo la ajabu kabisa. Miaka mingi baadaye aliandika yote katika kitabu cha kuchekesha sana kiitwacho <strong>'Familia Yangu na Wanyama Wengine'</strong>.",
      "Alipokua, Gerald alipata wazo jipya. Alijenga <strong>bustani ya wanyama</strong> kwenye kisiwa cha Jersey, lakini si ya kuwaonyesha wanyama tu. Bustani yake ilikuwa kitalu salama kwa wanyama adimu kuliko wote duniani — wale waliobaki wachache sana hata wangeweza kutoweka kabisa. Huko wangeweza kuzaa watoto kwa amani, kisha kurudishwa nyumbani katika misitu na visiwa vyao wenyewe.",
      "Ilifanikiwa. <strong>Njiwa wa waridi</strong> wa Morisi, laini na mwenye rangi ya waridi, alikuwa amebaki ndege wachache tu — na leo anaruka porini tena. Tumbili wa dhahabu mwenye manyoya shingoni kama simba mdogo aliyetengenezwa kwa mwanga wa jua naye aliokolewa hivyo hivyo. Gerald alitumia hadithi zake za kuchekesha kulipia kazi nzito. Alionyesha kwamba ukiwapenda wanyama vya kutosha kucheka nao, utapigana ili <strong>uwahifadhi</strong>."
    ],
    fr: [
      "Quand Gerald était petit, sa famille fit ses valises et partit pour <strong>Corfou</strong>, une île grecque ensoleillée au milieu d'une mer très bleue. Au lieu de rester dans une salle de classe ordinaire, il passa cinq années entières dehors, un <strong>filet</strong> dans une main et un bocal dans l'autre, avec un gentil précepteur qui le laissait étudier les animaux toute la journée.",
