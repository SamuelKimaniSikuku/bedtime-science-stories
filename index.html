<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Malakai Stories · Bedtime Stories That Teach · Hadithi za Usiku Zenye Funzo · Histoires du Soir Qui Enseignent</title>
<style>
  :root {
    --night: #0f1630;
    --night-deep: #0a0f22;
    --card: #1a2244;
    --card-hover: #222c56;
    --ink: #f2f0e9;
    --ink-soft: #b8bdd4;
    --gold: #f5c664;
    --moon: #ffe9b8;
    --accent-africa: #6ecf8e;
    --accent-europe: #7fa8f0;
    --accent-americas: #f08f7f;
    --accent-asia: #c39bf0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--night-deep); }
  body {
    background: linear-gradient(180deg, var(--night-deep) 0%, var(--night) 40%, #16204a 100%);
    color: var(--ink);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }
  /* --- twinkling stars --- */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .star { position: absolute; background: #fff; border-radius: 50%; opacity: .7; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%,100% { opacity:.15; } 50% { opacity:.85; } }

  .wrap { position: relative; z-index: 1; max-width: 1060px; margin: 0 auto; padding: 32px 20px 80px; }

  header { text-align: center; margin-bottom: 28px; }
  .moon { font-size: 52px; display: inline-block; animation: floaty 6s ease-in-out infinite; }
  @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  h1 { font-size: clamp(26px, 4vw, 40px); color: var(--moon); margin: 8px 0 6px; font-weight: 700; }
  .subtitle { color: var(--ink-soft); font-size: 16px; max-width: 640px; margin: 0 auto; }

  /* --- language switcher --- */
  .lang-switch { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 22px 0 8px; }
  .lang-btn {
    background: transparent; border: 1.5px solid #3a466f; color: var(--ink-soft);
    padding: 8px 20px; border-radius: 999px; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .lang-btn:hover { border-color: var(--gold); color: var(--ink); }
  .lang-btn.active { background: var(--gold); border-color: var(--gold); color: #201a08; }

  /* --- filters --- */
  .filters {
    background: rgba(255,255,255,.03); border: 1px solid #2b3560; border-radius: 20px;
    padding: 20px 22px; margin: 26px 0 30px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .filter-group + .filter-group { border-top: 1px solid rgba(255,255,255,.06); padding-top: 18px; }
  .filter-label {
    display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .14em;
    color: var(--gold); font-weight: 700; margin-bottom: 10px;
  }
  /* align-items/align-content keep the pills at their natural height instead of
     stretching to fill the row when it wraps. */
  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; align-content: flex-start; }
  .chip {
    background: transparent; border: 1.5px solid #323d68; color: var(--ink-soft);
    padding: 8px 16px; border-radius: 999px; font-size: 14px; cursor: pointer;
    transition: all .18s; font-family: inherit;
    display: inline-flex; align-items: center; gap: 8px; line-height: 1.1;
  }
  .chip:hover { color: var(--ink); border-color: #56639a; background: rgba(255,255,255,.05); }
  /* --- search --- */
  .search-group { padding-bottom: 2px; }
  .search-box { position: relative; display: flex; align-items: center; }
  .search-ico { position: absolute; left: 15px; font-size: 15px; opacity: .6; pointer-events: none; }
  #searchInput {
    width: 100%; background: #141b38; border: 1.5px solid #323d68; color: var(--ink);
    border-radius: 999px; padding: 11px 42px 11px 42px; font-size: 15px; font-family: inherit;
    transition: border-color .18s;
    -webkit-appearance: none; appearance: none;
  }
  #searchInput:focus { outline: none; border-color: var(--gold); }
  #searchInput::placeholder { color: #6b74a0; }
  #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  .search-clear {
    position: absolute; right: 10px; background: #2a355f; border: none; color: var(--ink);
    width: 26px; height: 26px; border-radius: 50%; font-size: 13px; cursor: pointer;
    font-family: inherit; line-height: 1; transition: background .18s;
  }
  .search-clear:hover { background: #3c4a80; }

  /* NB: not ".empty" — that class already styles the no-stories message (padding: 50px). */
  .chip.zero { opacity: .3; cursor: default; }
  .chip.zero:hover { color: var(--ink-soft); border-color: #323d68; background: transparent; }
  .chip.active {
    background: var(--gold); border-color: var(--gold); color: #241d07; font-weight: 700;
    box-shadow: 0 4px 14px rgba(245,198,100,.28);
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
  .chip .cnt { font-size: 11.5px; opacity: .55; font-weight: 600; }
  .chip.active .cnt { opacity: .75; }

  .count-line { color: var(--ink-soft); font-size: 14px; margin: 0 4px 14px; }

  /* --- story grid --- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card {
    background: var(--card); border: 1px solid #2b3560; border-radius: 20px;
    padding: 22px; cursor: pointer; transition: transform .18s, background .18s, box-shadow .18s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { transform: translateY(-4px); background: var(--card-hover); box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .card-top { display: flex; align-items: center; gap: 14px; }
  .avatar {
    font-size: 30px; width: 58px; height: 58px; flex: 0 0 58px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 25%, #33406f, #1c2547);
  }
  .card h2 { font-size: 19px; color: var(--ink); }
  .years { font-size: 13px; color: var(--ink-soft); }
  .card-title { color: var(--gold); font-size: 15px; font-weight: 600; font-style: italic; }
  .hook { color: var(--ink-soft); font-size: 14.5px; flex: 1; }
  .badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
  .badge { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; letter-spacing: .02em; }
  .badge.region-africa   { background: rgba(110,207,142,.16); color: var(--accent-africa); }
  .badge.region-europe   { background: rgba(127,168,240,.16); color: var(--accent-europe); }
  .badge.region-americas { background: rgba(240,143,127,.16); color: var(--accent-americas); }
  .badge.region-asia     { background: rgba(195,155,240,.16); color: var(--accent-asia); }
  .badge.topic { background: rgba(245,198,100,.13); color: var(--gold); }
  .read-hint { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .empty { text-align: center; color: var(--ink-soft); padding: 50px 0; font-size: 17px; grid-column: 1 / -1; }

  /* --- reader modal --- */
  .overlay {
    position: fixed; inset: 0; background: rgba(5,8,20,.82); backdrop-filter: blur(6px);
    display: none; align-items: flex-start; justify-content: center; z-index: 10;
    padding: 4vh 16px; overflow-y: auto;
  }
  .overlay.open { display: flex; }
  .reader {
    background: linear-gradient(180deg, #1d2650, #161e40); border: 1px solid #38437a;
    border-radius: 24px; max-width: 720px; width: 100%; padding: 34px 36px 40px;
    box-shadow: 0 24px 80px rgba(0,0,0,.5); position: relative;
  }
  .close-btn {
    position: absolute; top: 16px; right: 16px; background: #2a355f; border: none;
    color: var(--ink); width: 38px; height: 38px; border-radius: 50%; font-size: 18px;
    cursor: pointer; transition: background .2s;
  }
  .close-btn:hover { background: #3c4a80; }
  .reader .avatar { margin-bottom: 6px; }
  .reader h2 { font-size: 26px; color: var(--moon); margin: 4px 0 2px; }
  .reader .story-title { color: var(--gold); font-size: 18px; font-style: italic; margin-bottom: 4px; }
  .reader .meta { color: var(--ink-soft); font-size: 14px; margin-bottom: 16px; }
  .reader .badges { margin-bottom: 18px; }
  .reader p { font-size: 17.5px; margin-bottom: 16px; color: #e9e7de; }
  .reader p strong { color: var(--moon); }
  .goodnight { text-align: center; color: var(--gold); font-size: 16px; margin-top: 26px; }
  .reader-langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .reader-langs .lang-btn { padding: 5px 12px; font-size: 13px; }

  /* grouped language switcher */
  .lang-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .lang-africa { margin-top: 12px; }
  .lang-africa-label {
    display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
    color: var(--gold); font-weight: 700; margin-bottom: 8px; opacity: .85;
  }
  .xlate-note {
    background: rgba(127,168,240,.12); border: 1px solid rgba(127,168,240,.35);
    color: #cdd9f5; font-size: 13px; border-radius: 12px; padding: 9px 13px; margin-bottom: 16px;
  }

  /* --- narrate (read aloud) --- */
  .narrate-btn {
    display: inline-flex; align-items: center; gap: 9px;
    background: var(--card-hover); border: 1.5px solid #3a466f; color: var(--ink);
    padding: 11px 22px; border-radius: 999px; font-size: 15.5px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin: 2px 0 22px; transition: all .2s;
  }
  .narrate-btn:hover { border-color: var(--gold); }
  .narrate-btn.speaking { background: var(--gold); border-color: var(--gold); color: #201a08; }
  .narrate-btn .ico { font-size: 18px; line-height: 1; }
  .narrate-btn.speaking .ico { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .reader p.speaking {
    background: rgba(245,198,100,.14);
    box-shadow: 0 0 0 8px rgba(245,198,100,.14);
    border-radius: 8px; transition: background .2s;
  }

  footer { text-align: center; color: var(--ink-soft); margin-top: 56px; font-size: 14px; }
  .credit { font-size: 12px; margin-top: 8px; opacity: .75; }

  /* --- feedback --- */
  .feedback {
    background: rgba(255,255,255,.03); border: 1px solid #2b3560; border-radius: 20px;
    padding: 26px 24px; margin: 44px 0 0; text-align: center;
  }
  .fb-title { font-size: 21px; color: var(--moon); margin-bottom: 6px; }
  .fb-sub { font-size: 14.5px; color: var(--ink-soft); margin-bottom: 18px; }
  .fb-stars { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .fb-star {
    background: none; border: none; cursor: pointer; font-size: 34px; line-height: 1;
    color: #3b466f; padding: 2px 4px;
    transition: transform .12s, color .12s; font-family: inherit;
  }
  .fb-star:hover { transform: scale(1.15); }
  .fb-star.on { color: var(--gold); }
  .fb-input, .fb-text {
    width: 100%; background: #141b38; border: 1.5px solid #323d68; color: var(--ink);
    border-radius: 12px; padding: 12px 14px; font-size: 15px; font-family: inherit;
    margin-bottom: 12px; resize: vertical;
  }
  .fb-input:focus, .fb-text:focus { outline: none; border-color: var(--gold); }
  .fb-input::placeholder, .fb-text::placeholder { color: #6b74a0; }
  .fb-send {
    background: var(--gold); border: none; color: #201a08; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; font-size: 15.5px; cursor: pointer;
    font-family: inherit; transition: transform .12s, box-shadow .2s;
    box-shadow: 0 4px 14px rgba(245,198,100,.28);
  }
  .fb-send:hover { transform: translateY(-2px); }
  .fb-thanks { font-size: 18px; color: var(--gold); padding: 14px 0; line-height: 1.5; }

  /* --- music toggle --- */
  .music-dock {
    position: fixed; bottom: 22px; right: 22px; z-index: 8;
    display: flex; flex-direction: column; align-items: flex-end; gap: 7px;
  }
  .now-playing {
    font-size: 12px; color: var(--ink-soft); max-width: 230px; text-align: right;
    background: rgba(15,22,48,.82); border-radius: 10px; padding: 4px 10px;
    line-height: 1.35;
  }
  .now-playing:empty { display: none; }
  .music-btn {
    background: var(--card); border: 1.5px solid #3a466f; color: var(--ink);
    padding: 10px 18px; border-radius: 999px; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); transition: all .2s;
  }
  .music-btn:hover { border-color: var(--gold); }
  .music-btn.playing { background: var(--gold); border-color: var(--gold); color: #201a08; }
  .music-btn.playing .note { animation: sway 1.8s ease-in-out infinite; display: inline-block; }
  @keyframes sway { 0%,100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
  @media (max-width: 560px) { .reader { padding: 26px 20px 32px; } }
</style>
</head>

  hook: { en: "A quiet farm boy watches an apple fall — and discovers the invisible force that moves the whole universe.",
          sw: "Mvulana mkimya wa shambani aona tufaha likianguka — na kugundua nguvu isiyoonekana inayosogeza ulimwengu mzima.",
          fr: "Un garçon de ferme silencieux voit une pomme tomber — et découvre la force invisible qui fait bouger tout l'univers." },
  textM: {
    en: [
      "A long, long time ago — on Christmas Day in the year 1643 — a very small baby was born on a quiet farm in England. His name was Isaac Newton, and he was so tiny that his mother said he could fit inside a big cooking pot. Nobody in the village that night could have guessed that this little baby would one day explain how the whole universe moves.",
      "Isaac's father died before he was born, and when Isaac was small his mother had to go away for a while, so he lived with his grandmother. He was a quiet boy who didn't say very much — but his eyes were always busy. He watched the rain slide down the window. He watched the shadows creep across the wall as the sun moved. And inside his head, questions piled up like autumn leaves.",
      "While other children played ball in the village square, Isaac built things. He built a little windmill that really spun, copying the big one being built nearby — and when there was no wind, he put a mouse inside on a tiny wheel to make it turn! He built kites, and paper lanterns, and a water clock that dripped, drop by drop, to tell the time. The neighbors thought he was strange. Isaac didn't mind. Builders and wonderers often look strange to people who have stopped wondering.",
      "When Isaac grew up, he went to the great University of Cambridge to study. But then something frightening happened: a terrible sickness spread through the cities, and the university had to close. Isaac packed his books and went home to the quiet farm. Most people would have rested. Isaac did the opposite — alone in the countryside, with nothing but time, his mind opened up like a window. He later called it his \"year of wonders.\"",
      "It was there, in the orchard, that the famous moment came. Isaac sat thinking under an apple tree, and an apple fell — <strong>thump</strong> — onto the grass. Everyone in the world had seen apples fall. But Isaac asked the question nobody thought to ask: \"Why does it fall <strong>down</strong>? Why not sideways? Why not up? And how high would the apple have to be before it stopped falling?\" He looked up past the branches, up at the pale daytime Moon, and a shiver of an idea ran through him: what if the same invisible pull that grabs the apple… reaches all the way up to the Moon?",
      "That invisible pull is called <strong>gravity</strong>, and Isaac discovered its secret: everything pulls on everything else. The Earth pulls the apple, and the apple pulls the Earth — just a tiny, tiny bit. The Earth holds the Moon in its arms, the Sun holds the Earth, and that is why the planets glide around the sky in great smooth circles instead of drifting away like lost balloons.",
      "Isaac also wrote three simple rules — his <strong>laws of motion</strong> — that explain how everything moves: why a rolling ball slows down, why a rocket pushes up when fire rushes down, why you slide forward when a bus stops suddenly. Hundreds of years later, when engineers wanted to fly people to the Moon, they didn't need new rules. They used Isaac's.",
      "So tonight, when you see the Moon following you home, remember the quiet boy from the farm, who watched, and wondered, and never stopped asking <strong>why</strong>. The same gentle gravity that holds the Moon in the sky is holding you softly in your bed. Let it hold you now… all the way into sleep. Goodnight."
    ],
    sw: [
      "Zamani sana — siku ya Krismasi mwaka wa 1643 — mtoto mdogo sana alizaliwa katika shamba tulivu nchini Uingereza. Jina lake lilikuwa Isaac Newton, na alikuwa mdogo mno hata mama yake alisema angeweza kutoshea ndani ya chungu kikubwa cha kupikia. Hakuna mtu kijijini usiku ule ambaye angeweza kubashiri kwamba mtoto huyu mdogo siku moja angeeleza jinsi ulimwengu mzima unavyosogea.",
      "Baba yake Isaac alifariki kabla hajazaliwa, na Isaac alipokuwa mdogo mama yake alilazimika kwenda mbali kwa muda, kwa hiyo aliishi na bibi yake. Alikuwa mvulana mkimya asiyeongea sana — lakini macho yake yalikuwa na shughuli daima. Aliangalia mvua ikiteleza dirishani. Aliangalia vivuli vikitambaa ukutani jua lilipohama. Na ndani ya kichwa chake, maswali yalirundikana kama majani ya vuli.",
      "Watoto wengine walipocheza mpira uwanjani, Isaac alijenga vitu. Alijenga kinu kidogo cha upepo kilichozunguka kweli, akiiga kile kikubwa kilichokuwa kikijengwa jirani — na upepo ulipokosekana, aliweka panya ndani kwenye gurudumu dogo ili kukizungusha! Alijenga tiara, na taa za karatasi, na saa ya maji iliyodondoka, tone kwa tone, kuonyesha muda. Majirani walidhani ni mtoto wa ajabu. Isaac hakujali. Wajenzi na wadadisi mara nyingi huonekana wa ajabu kwa watu walioacha kudadisi.",
      "Isaac alipokua, alienda Chuo Kikuu kikuu cha Cambridge kusoma. Lakini kisha jambo la kutisha likatokea: ugonjwa mbaya ulienea mijini, na chuo kikuu kikalazimika kufungwa. Isaac alifunga vitabu vyake na kurudi nyumbani kwenye shamba tulivu. Watu wengi wangepumzika. Isaac alifanya kinyume — akiwa peke yake mashambani, bila kitu ila muda, akili yake ilifunguka kama dirisha. Baadaye aliuita mwaka ule \"mwaka wake wa maajabu.\"",
      "Ilikuwa huko, katika bustani ya matunda, wakati ule maarufu ulipofika. Isaac aliketi akifikiri chini ya mti wa tufaha, na tufaha likaanguka — <strong>puu</strong> — kwenye nyasi. Kila mtu duniani alikuwa ameona matufaha yakianguka. Lakini Isaac aliuliza swali ambalo hakuna aliyefikiria kuliuliza: \"Kwa nini linaanguka <strong>chini</strong>? Kwa nini si pembeni? Kwa nini si juu? Na tufaha lingehitaji kuwa juu kiasi gani ndipo liache kuanguka?\" Alitazama juu kupita matawi, juu kwenye Mwezi hafifu wa mchana, na wazo likampitia kama mtetemo: itakuwaje kama mvuto uleule usioonekana unaolikamata tufaha… unafika juu kabisa hadi Mwezini?",
      "Mvuto huo usioonekana unaitwa <strong>graviti</strong>, na Isaac aligundua siri yake: kila kitu kinavuta kila kitu kingine. Dunia inavuta tufaha, na tufaha linaivuta Dunia — kidogo sana, sana. Dunia inamshika Mwezi mikononi mwake, Jua linaishika Dunia, na ndiyo maana sayari zinateleza angani katika miduara mikubwa laini badala ya kupeperuka kama puto zilizopotea.",
      "Isaac pia aliandika kanuni tatu rahisi — <strong>sheria zake za mwendo</strong> — zinazoeleza jinsi kila kitu kinavyosogea: kwa nini mpira unaoviringika hupunguza mwendo, kwa nini roketi husukumwa juu moto unaposhuka chini, kwa nini unasukumwa mbele basi linaposimama ghafla. Mamia ya miaka baadaye, wahandisi walipotaka kupeleka watu Mwezini, hawakuhitaji kanuni mpya. Walitumia za Isaac.",
      "Kwa hiyo usiku wa leo, utakapomwona Mwezi akikufuata nyumbani, mkumbuke mvulana mkimya wa shambani, aliyetazama, na kushangaa, na ambaye hakuacha kamwe kuuliza <strong>kwa nini</strong>. Graviti ileile pole inayomshika Mwezi angani inakushika wewe taratibu kitandani mwako. Iache ikushike sasa… mpaka usingizini. Lala salama."
    ],
    fr: [
      "Il y a très, très longtemps — le jour de Noël de l'année 1643 — un tout petit bébé est né dans une ferme tranquille d'Angleterre. Il s'appelait Isaac Newton, et il était si minuscule que sa maman disait qu'il aurait tenu dans une grande marmite. Personne au village, cette nuit-là, n'aurait pu deviner que ce petit bébé expliquerait un jour comment bouge l'univers tout entier.",
      "Le papa d'Isaac est mort avant sa naissance, et quand Isaac était petit, sa maman a dû partir quelque temps ; il a donc vécu chez sa grand-mère. C'était un garçon silencieux qui ne parlait pas beaucoup — mais ses yeux étaient toujours occupés. Il regardait la pluie glisser sur la fenêtre. Il regardait les ombres ramper le long du mur à mesure que le soleil avançait. Et dans sa tête, les questions s'empilaient comme des feuilles d'automne.",
      "Pendant que les autres enfants jouaient au ballon sur la place du village, Isaac construisait des choses. Il a construit un petit moulin à vent qui tournait vraiment, en copiant le grand qu'on bâtissait à côté — et quand il n'y avait pas de vent, il mettait une souris à l'intérieur, sur une petite roue, pour le faire tourner ! Il a construit des cerfs-volants, des lanternes de papier, et une horloge à eau qui gouttait, goutte après goutte, pour dire l'heure. Les voisins le trouvaient étrange. Isaac s'en moquait. Ceux qui construisent et s'émerveillent paraissent souvent étranges à ceux qui ont cessé de s'émerveiller.",
      "Quand Isaac a grandi, il est allé étudier à la grande université de Cambridge. Mais alors, quelque chose d'effrayant est arrivé : une terrible maladie s'est répandue dans les villes, et l'université a dû fermer. Isaac a rangé ses livres et est rentré à la ferme tranquille. La plupart des gens se seraient reposés. Isaac a fait le contraire — seul à la campagne, avec rien d'autre que du temps, son esprit s'est ouvert comme une fenêtre. Plus tard, il a appelé cette période son « année des merveilles ».",
      "C'est là, dans le verger, qu'est venu le moment célèbre. Isaac réfléchissait, assis sous un pommier, quand une pomme est tombée — <strong>boum</strong> — dans l'herbe. Tout le monde avait déjà vu tomber des pommes. Mais Isaac a posé la question que personne ne pensait à poser : « Pourquoi tombe-t-elle vers le <strong>bas</strong> ? Pourquoi pas de côté ? Pourquoi pas vers le haut ? Et à quelle hauteur faudrait-il monter la pomme pour qu'elle arrête de tomber ? » Il a levé les yeux au-delà des branches, vers la Lune pâle du jour, et une idée l'a traversé comme un frisson : et si la même force invisible qui attrape la pomme… montait jusqu'à la Lune ?",
      "Cette force invisible s'appelle la <strong>gravité</strong>, et Isaac a découvert son secret : tout attire tout. La Terre attire la pomme, et la pomme attire la Terre — un tout petit, petit peu. La Terre tient la Lune dans ses bras, le Soleil tient la Terre, et c'est pour cela que les planètes glissent dans le ciel en grands cercles réguliers au lieu de s'envoler comme des ballons perdus.",
      "Isaac a aussi écrit trois règles simples — ses <strong>lois du mouvement</strong> — qui expliquent comment tout bouge : pourquoi un ballon qui roule ralentit, pourquoi une fusée monte quand le feu descend, pourquoi tu glisses en avant quand le bus s'arrête brusquement. Des centaines d'années plus tard, quand les ingénieurs ont voulu envoyer des gens sur la Lune, ils n'ont pas eu besoin de nouvelles règles. Ils ont utilisé celles d'Isaac.",
      "Alors ce soir, quand tu verras la Lune qui te suit jusqu'à la maison, souviens-toi du garçon silencieux de la ferme, qui regardait, s'émerveillait, et n'a jamais cessé de demander <strong>pourquoi</strong>. La même douce gravité qui tient la Lune dans le ciel te tient doucement dans ton lit. Laisse-la te tenir maintenant… jusque dans le sommeil. Bonne nuit."
    ]

  textL: {
    en: [
      "Are you cozy? Then let me tell you the whole story of Isaac Newton — the quiet boy who discovered why things fall, and why the Moon never does.",
      "A long, long time ago, on Christmas Day in the year 1643, on a small farm called Woolsthorpe in the English countryside, a baby boy was born much too early. He was so small and so weak that his mother, Hannah, said he could fit inside a big cooking pot, and the neighbors whispered that he might not live through the winter. But the tiny baby held on. He breathed, and slept, and grew — slowly, stubbornly — and that quiet stubbornness stayed with him his whole life. His name was Isaac Newton.",
      "Isaac's father had died before Isaac was born, and when Isaac was three, his mother married again and went to live in another village, leaving him with his grandmother. The farmhouse was quiet. The fields were quiet. And Isaac became a quiet boy — the kind who sits by the window during a storm, not because he is sad, but because he is <strong>watching</strong>. He watched raindrops race down the glass and wondered why some ran faster than others. He watched the sun throw shadows across the wall, and he began marking where the shadows fell at different hours, until the whole wall became a giant clock that only he could read.",
      "At school in the nearby town, Isaac was not the best student at first. But he had clever hands and a head full of ideas. While other boys played, he built. He built a little windmill, copying the big one the workers were building near the village — except his really turned, and when the wind stopped, he put a little mouse inside on a wheel, and the mouse-power kept it spinning! He built kites and flew them at dusk with paper lanterns tied to their tails, so that they floated over the village like small warm stars. He built a water clock that told time drop by drop, and sundials so good the family used them. The neighbors shook their heads: \"What a strange boy.\" But strange, sometimes, is just what wonderful looks like at the beginning.",
      "Isaac's mother wanted him to become a farmer, like his father. So one year, she took him out of school to tend the sheep and sell vegetables at the market. It went terribly. Isaac would let the sheep wander off while he sat under a hedge reading a book, or he'd build a little water wheel in the stream while the cows walked into the neighbor's field. His uncle and his old schoolmaster saw the truth: this boy's mind was not made for farming. They persuaded his mother to send him back to school — and then onward, to the great University of <strong>Cambridge</strong>.",
      "At Cambridge, Isaac read everything he could reach. He filled notebooks with questions — page after page, question after question, like: What is light? Why does the Moon follow the Earth? What makes things fall? He wrote in one notebook, in Latin: \"Plato is my friend, Aristotle is my friend — but my best friend is truth.\"",
      "Then, when Isaac was twenty-two, something frightening happened. A terrible sickness — the plague — spread through the cities of England, and the university closed its doors. Everyone was sent home. Isaac packed his books and rode back to the quiet farm at Woolsthorpe, where the only sounds were the wind, the sheep, and the creak of the apple trees.",
      "And there, far from teachers and lectures, alone with his thoughts, the most amazing eighteen months in the history of science quietly happened. Isaac later called it his <strong>year of wonders</strong>. He invented a whole new kind of mathematics. He took a beam of sunlight into a dark room, passed it through a glass prism, and discovered that plain white light secretly contains <strong>all the colors of the rainbow</strong>. And one golden afternoon, in the orchard, he sat thinking under an apple tree…",
      "<strong>Thump.</strong> An apple fell onto the grass beside him. Now — everyone in the world had seen apples fall. Farmers saw it every autumn. Nobody thought it was interesting. But Isaac looked at that apple, and then he did the thing that made him Isaac: he asked, \"<strong>Why?</strong> Why does it fall straight down? Why not sideways? Why not upward? What is pulling it?\" And then he asked the question that changed everything. He looked up, past the branches, where the pale daytime Moon was hanging in the blue sky, and he wondered: \"Does the pull that grabs this apple reach higher than the treetops? Higher than the clouds? Does it reach… all the way to the <strong>Moon</strong>?\"",
      "It does. Isaac worked it out with his new mathematics, carefully, line by line. The same invisible pull — he called it <strong>gravity</strong> — holds the apple, the rain, you, me, and the Moon itself. But wait, you might ask: if the Earth pulls the Moon, why doesn't the Moon fall down like the apple? Here is Isaac's beautiful answer: the Moon <strong>is</strong> falling — it is falling around the Earth! The Moon rushes sideways so fast that as it falls, the Earth's surface curves away beneath it, and so it circles round and round, falling forever without ever landing, like a marble rolling round and round the inside of a great bowl. That is what an orbit is. The Moon is the apple that never hits the grass.",
      "Isaac also wrote down three simple rules — his <strong>laws of motion</strong> — that explain every push and pull in the world: why a sled glides on and on across smooth ice, why you need to pedal harder to start a bicycle than to keep it rolling, why a rocket rises when its fire rushes down. Sailors used his rules to cross oceans. Engineers used them to build bridges and trains. And three hundred years later, when people finally flew to the Moon in a rocket, the scientists guiding them were still using Isaac's three rules, exactly as he wrote them by candlelight.",
      "Isaac grew old and famous. He became the head of the Royal Society, where the wisest people of the land met, and he was made a knight — Sir Isaac Newton. But he never grew too grand to wonder. Near the end of his life, he said something lovely: \"I seem to have been only like a boy playing on the seashore, finding a smoother pebble or a prettier shell than usual, while the great ocean of truth lay all undiscovered before me.\" After all he had found — the rainbow hiding in light, the mathematics of the heavens, the secret of the falling apple — he still felt like a child at the edge of the sea, with everything left to explore.",
      "And that, little dreamer, is the real secret of Isaac Newton. Not the apple. Not the equations. It is this: he kept the question \"why?\" alive in his heart his whole life, the way you keep it alive now. So tonight, when you lie still and feel your blanket resting softly on you — that gentle heaviness is Isaac's gravity, the same kindly pull that holds the Moon in the sky and the planets around the Sun. The whole universe is holding you in place, very gently, like a hand on a sleeping bird.",
      "Close your eyes now. Somewhere high above the rooftops, the Moon is falling around the Earth, round and round, slow and faithful, just as it did over Isaac's orchard long ago. It will keep circling all night while you sleep. Everything is moving just as it should. Goodnight, my love. Sleep well… and dream big dreams."
    ],
    sw: [
      "Umejifunika vizuri? Basi nikusimulie hadithi nzima ya Isaac Newton — mvulana mkimya aliyegundua kwa nini vitu vinaanguka, na kwa nini Mwezi hauanguki kamwe.",
      "Zamani sana, siku ya Krismasi mwaka wa 1643, katika shamba dogo liitwalo Woolsthorpe mashambani mwa Uingereza, mtoto wa kiume alizaliwa mapema mno. Alikuwa mdogo sana na dhaifu sana hata mama yake, Hannah, alisema angeweza kutoshea ndani ya chungu kikubwa cha kupikia, na majirani walinong'ona kwamba huenda asivuke msimu wa baridi. Lakini mtoto yule mdogo alishikilia. Alipumua, akalala, akakua — taratibu, kwa ukaidi — na ukaidi ule wa kimya ulibaki naye maisha yake yote. Jina lake lilikuwa Isaac Newton.",
      "Baba yake Isaac alikuwa amefariki kabla Isaac hajazaliwa, na Isaac alipokuwa na miaka mitatu, mama yake aliolewa tena na kwenda kuishi kijiji kingine, akamwacha na bibi yake. Nyumba ya shamba ilikuwa kimya. Mashamba yalikuwa kimya. Na Isaac akawa mvulana mkimya — aina ile inayoketi dirishani wakati wa dhoruba, si kwa sababu ana huzuni, bali kwa sababu <strong>anatazama</strong>. Alitazama matone ya mvua yakishindana kuteremka kwenye kioo na kujiuliza kwa nini mengine yanakimbia kuliko mengine. Alitazama jua likitupa vivuli ukutani, na akaanza kuweka alama mahali vivuli vilipoangukia saa tofauti, hadi ukuta wote ukawa saa kubwa ambayo yeye peke yake angeweza kuisoma.",
      "Shuleni katika mji wa jirani, Isaac hakuwa mwanafunzi bora mwanzoni. Lakini alikuwa na mikono ya ustadi na kichwa kilichojaa mawazo. Wavulana wengine walipocheza, yeye alijenga. Alijenga kinu kidogo cha upepo, akiiga kile kikubwa ambacho wafanyakazi walikuwa wakikijenga karibu na kijiji — ila chake kilizunguka kweli, na upepo ulipokoma, aliweka panya mdogo ndani kwenye gurudumu, na nguvu-ya-panya ikaendelea kukizungusha! Alijenga tiara na kuzirusha jioni na taa za karatasi zilizofungwa mikiani, zikaelea juu ya kijiji kama nyota ndogo za joto. Alijenga saa ya maji iliyosema muda tone kwa tone, na saa za jua nzuri kiasi kwamba familia ilizitumia. Majirani walitikisa vichwa: \"Mtoto wa ajabu kweli.\" Lakini ajabu, wakati mwingine, ndivyo uzuri unavyoonekana mwanzoni.",
      "Mama yake Isaac alitaka awe mkulima, kama baba yake. Basi mwaka mmoja, alimtoa shuleni ili achunge kondoo na kuuza mboga sokoni. Ilienda vibaya kabisa. Isaac aliwaacha kondoo wakizurura huku akiketi chini ya ua akisoma kitabu, au alijenga gurudumu dogo la maji mtoni huku ng'ombe wakiingia shamba la jirani. Mjomba wake na mwalimu wake wa zamani waliona ukweli: akili ya mvulana huyu haikuumbwa kwa ukulima. Walimshawishi mama yake amrudishe shuleni — na kisha mbele, hadi Chuo Kikuu kikuu cha <strong>Cambridge</strong>.",
      "Cambridge, Isaac alisoma kila kitu alichoweza kukifikia. Alijaza madaftari maswali — ukurasa baada ya ukurasa, swali baada ya swali, kama: Mwanga ni nini? Kwa nini Mwezi unaifuata Dunia? Nini kinafanya vitu vianguke? Aliandika katika daftari moja, kwa Kilatini: \"Plato ni rafiki yangu, Aristotle ni rafiki yangu — lakini rafiki yangu mkubwa zaidi ni ukweli.\"",
      "Kisha, Isaac alipokuwa na miaka ishirini na miwili, jambo la kutisha likatokea. Ugonjwa mbaya — tauni — ulienea miji ya Uingereza, na chuo kikuu kikafunga milango yake. Kila mtu alirudishwa nyumbani. Isaac alifunga vitabu vyake na kurudi kwenye shamba tulivu la Woolsthorpe, ambako sauti pekee zilikuwa upepo, kondoo, na mlio wa miti ya matufaha.",
      "Na huko, mbali na walimu na mihadhara, peke yake na mawazo yake, miezi kumi na minane ya kushangaza zaidi katika historia ya sayansi ilitokea kimyakimya. Isaac baadaye aliiita <strong>mwaka wake wa maajabu</strong>. Alibuni aina mpya kabisa ya hisabati. Aliingiza mwale wa jua chumbani mwenye giza, akaupitisha kwenye prizimu ya kioo, na akagundua kwamba mwanga mweupe wa kawaida umeficha ndani yake <strong>rangi zote za upinde wa mvua</strong>. Na mchana mmoja wa dhahabu, katika bustani ya matufaha, aliketi akifikiri chini ya mti wa tufaha…",
      "<strong>Puu.</strong> Tufaha likaanguka kwenye nyasi kando yake. Sasa — kila mtu duniani alikuwa ameona matufaha yakianguka. Wakulima waliliona kila vuli. Hakuna aliyeona ni jambo la kuvutia. Lakini Isaac alilitazama tufaha lile, kisha akafanya kile kilichomfanya kuwa Isaac: aliuliza, \"<strong>Kwa nini?</strong> Kwa nini linaanguka moja kwa moja chini? Kwa nini si pembeni? Kwa nini si juu? Nini kinalivuta?\" Kisha akauliza swali lililobadilisha kila kitu. Alitazama juu, kupita matawi, ambako Mwezi hafifu wa mchana ulining'inia katika anga la buluu, na akajiuliza: \"Je, mvuto unaolikamata tufaha hili unafika juu kuliko vilele vya miti? Juu kuliko mawingu? Unafika… mpaka <strong>Mwezini</strong>?\"",
      "Unafika. Isaac alilifanyia hesabu kwa hisabati yake mpya, kwa makini, mstari kwa mstari. Mvuto uleule usioonekana — aliuita <strong>graviti</strong> — unalishika tufaha, mvua, wewe, mimi, na Mwezi wenyewe. Lakini subiri, unaweza kuuliza: kama Dunia inamvuta Mwezi, kwa nini Mwezi hauanguki chini kama tufaha? Hili ndilo jibu zuri la Isaac: Mwezi <strong>unaanguka</strong> — unaanguka kuzunguka Dunia! Mwezi unakimbia pembeni kwa kasi sana hivi kwamba unapoanguka, uso wa Dunia unajipinda na kuondoka chini yake, na hivyo unazunguka mzunguko baada ya mzunguko, ukianguka milele bila kutua kamwe, kama gololi inayoviringika ndani ya bakuli kubwa. Hiyo ndiyo maana ya obiti. Mwezi ni tufaha lisilogusa nyasi kamwe.",
      "Isaac pia aliandika kanuni tatu rahisi — <strong>sheria zake za mwendo</strong> — zinazoeleza kila msukumo na mvuto duniani: kwa nini sleji huteleza mbele mfululizo kwenye barafu laini, kwa nini unahitaji kukanyaga zaidi kuanzisha baiskeli kuliko kuiendeleza, kwa nini roketi huinuka moto wake unaposhuka chini. Mabaharia walitumia kanuni zake kuvuka bahari. Wahandisi walizitumia kujenga madaraja na treni. Na miaka mia tatu baadaye, watu walipopaa hatimaye kwenda Mwezini kwa roketi, wanasayansi waliowaongoza walikuwa bado wanatumia kanuni tatu za Isaac, sawasawa kama alivyoziandika kwa mwanga wa mshumaa.",
      "Isaac alizeeka na kuwa maarufu. Akawa mkuu wa Royal Society, walikokutana wenye hekima zaidi wa nchi, na akapewa heshima ya u-bwana — Sir Isaac Newton. Lakini hakuwa mkubwa mno kushangaa. Karibu na mwisho wa maisha yake, alisema jambo zuri: \"Naonekana nimekuwa kama mvulana tu anayecheza ufukweni, nikipata kokoto laini zaidi au kombe zuri zaidi kuliko kawaida, wakati bahari kubwa ya ukweli imelala mbele yangu bila kugunduliwa.\" Baada ya yote aliyoyapata — upinde wa mvua uliojificha ndani ya mwanga, hisabati ya mbingu, siri ya tufaha linaloanguka — bado alijisikia kama mtoto ukingoni mwa bahari, na kila kitu kingali cha kuchunguzwa.",

    fr: [

      "Il y a très, très longtemps, le jour de Noël de l'année 1643, dans une petite ferme appelée Woolsthorpe, dans la campagne anglaise, un petit garçon est né beaucoup trop tôt. Il était si petit et si fragile que sa maman, Hannah, disait qu'il aurait tenu dans une grande marmite, et les voisins murmuraient qu'il ne passerait peut-être pas l'hiver. Mais le minuscule bébé s'est accroché. Il a respiré, dormi, grandi — lentement, obstinément — et cette obstination tranquille l'a accompagné toute sa vie. Il s'appelait Isaac Newton.",

      "Dunia ilishangaa. Marie akawa mwanamke wa kwanza kabisa kushinda <strong>Tuzo ya Nobel</strong> — na kisha, miaka kadhaa baadaye, akashinda ya pili, katika sayansi tofauti, jambo ambalo hakuna mtu aliyewahi kulifanya. Uvumbuzi wake ulisaidia madaktari kuona ndani ya miili yetu na kupambana na magonjwa, na bado unasaidia hadi leo.",
      "Basi kumbuka usiku wa leo, mdogo wangu: hapo zamani kulikuwa na msichana aliyeambiwa 'hapana' — hapana shule, hapana chuo kikuu, hapana sayansi — naye alijibu kwa subira, ujasiri, na tikiti ya treni. Hakuna mlango uliofungwa unaobaki umefungwa milele kwa mtu anayekataa kuacha kujifunza. Sasa funga macho, ung'ae taratibu, kama radium gizani. Lala salama."
    ],
    fr: [
      "Il y a longtemps, en 1867, dans la ville de Varsovie, en Pologne, est née une petite fille nommée Maria Skłodowska. Elle était la plus jeune de cinq enfants, et l'appartement de sa famille était plein de livres, de poussière de craie et de grandes idées — son père était professeur de sciences, et sa mère dirigeait une école de filles. La petite Maria a appris à lire à quatre ans seulement, si tôt que tout le monde en fut étonné.",
      "Mais l'enfance de Maria ne fut pas facile. Sa famille avait peu d'argent, et son pays était alors gouverné par un empire lointain qui n'autorisait même pas les enfants à apprendre dans leur propre langue polonaise à l'école. Le plus dur de tout : dans le monde de Maria, il existait une règle qui semble incroyable aujourd'hui — <strong>les filles n'avaient pas le droit d'aller à l'université</strong>. Pas parce qu'elles n'étaient pas intelligentes. Simplement parce qu'elles étaient des filles.",
      "Maria a refusé de laisser son esprit se fermer comme une porte. La nuit, en secret, elle rejoignait d'autres jeunes femmes courageuses dans ce qu'elles appelaient « l'Université volante » — des cours secrets qui changeaient de maison en maison pour ne pas être découverts, où les filles étudiaient les sciences et l'histoire à la lampe, en guettant les pas dans l'escalier.",
      "Maria a fait un plan avec sa grande sœur Bronya. D'abord, Maria a travaillé pendant des années comme gouvernante, enseignant à des enfants à la campagne, et envoyait son salaire à Bronya, qui étudiait à Paris. Puis Bronya, à son tour, a fait venir Maria. Et ainsi, un jour froid, Maria est montée dans un wagon de quatrième classe avec un tabouret en bois, une couverture et ses livres, et a traversé l'Europe jusqu'à <strong>Paris</strong> — vers la célèbre université de la Sorbonne, qui accueillait les femmes.",
      "À Paris, elle avait souvent froid et souvent faim — certains soirs, elle ne mangeait que du pain avec du thé, et en hiver, elle empilait tous ses vêtements sur son lit pour se réchauffer. Mais enfin, enfin, elle avait le droit d'apprendre, et elle était si heureuse qu'elle a fini première de sa classe de physique. C'est là qu'elle a rencontré un savant doux et brillant nommé Pierre Curie, et ils se sont mariés. Maria est devenue <strong>Marie Curie</strong>.",
      "Ensemble, dans un vieux hangar qui prenait l'eau et dont les autres savants se moquaient, Marie et Pierre ont étudié une roche mystérieuse appelée pechblende, qui émettait des rayons d'énergie invisibles. Marie l'a fait bouillir, l'a remuée, l'a tamisée — des tonnes et des tonnes, jour après jour, les bras douloureux — jusqu'à découvrir non pas un, mais <strong>deux éléments tout nouveaux</strong> cachés à l'intérieur. Elle a nommé le premier <em>polonium</em>, en l'honneur de sa chère Pologne. Le second, qui luisait d'un pâle bleu-vert dans l'obscurité comme une petite étoile captive, elle l'a nommé <em>radium</em>. Et cette étrange énergie, elle l'a appelée la <strong>radioactivité</strong>.",
      "Le monde fut émerveillé. Marie est devenue la première femme à gagner un <strong>prix Nobel</strong> — puis, des années plus tard, elle en a gagné un deuxième, dans une autre science, ce que personne n'avait jamais fait. Ses découvertes ont aidé les médecins à voir l'intérieur de notre corps et à combattre les maladies — et elles les aident encore aujourd'hui.",
      "Alors souviens-toi ce soir, mon petit : il était une fois une fille à qui l'on disait « non » — non à l'école, non à l'université, non à la science — et qui a répondu avec de la patience, du courage, et un billet de train. Aucune porte fermée ne reste fermée pour toujours devant quelqu'un qui refuse d'arrêter d'apprendre. Maintenant ferme les yeux, et brille doucement, comme le radium dans le noir. Bonne nuit."
    ]

  textL: {
    en: [
      "Snuggle in close, little one. Tonight's story is about a girl who was told she could not — and who quietly, patiently, became one of the greatest scientists who ever lived. Her name was Maria.",
      "Maria Skłodowska was born in 1867 in Warsaw, the capital of Poland, the youngest of five children in a family that was rich in exactly one thing: learning. Her father taught physics and mathematics; her mother ran a school for girls. Their apartment was full of books, and on her father's shelf stood a cabinet of scientific instruments — glass tubes, scales, minerals — which little Maria admired the way other children admire sweets in a shop window.",
      "Maria taught herself to read at four years old, peeking over her big sister's shoulder. Her memory was astonishing: she could recite poems after hearing them twice, and her family sometimes tested her just to laugh in amazement. But those bright early years grew hard. When Maria was small, her mother became very ill and died, and money grew short. And over the whole country lay a heavier shadow: Poland was ruled then by a faraway empire, which forbade schools from teaching in Polish. Even the children's own language had to be whispered.",
      "In Maria's world there was one more unfairness, and it was aimed straight at her: <strong>universities did not accept girls</strong>. Maria finished school at fifteen with a gold medal — the best student in her class — and then stood before a closed door. Her brothers could study. She could not. Not because she lacked talent. Simply because she was a girl.",
      "Did Maria give up? She did not. In the evenings she slipped through the streets of Warsaw to secret gatherings that the students called the <strong>Flying University</strong> — flying, because the classes flew from apartment to apartment so the authorities wouldn't find them. In dim rooms with curtains drawn, young women studied biology, chemistry, and history, sharing books hand to hand, listening for footsteps on the stairs. Learning, for them, was an act of courage.",
      "Then Maria and her big sister Bronya made a pact — one of the loveliest pacts two sisters ever made. In Paris, far away in France, the great Sorbonne university accepted women. But the sisters were poor. So they agreed: Maria would work and send money so Bronya could study medicine first; then Bronya, once a doctor, would help Maria in return. And that is what they did. For six long years, Maria worked as a governess in the countryside, teaching other people's children, studying alone at night from borrowed books — physics, algebra, chemistry — waiting for her turn.",
      "At last, the letter came: <em>Come to Paris.</em> Maria, now twenty-four, climbed into the cheapest railway carriage with a folding stool to sit on, a blanket, and a trunk of books, and rode for days across Europe. When she enrolled at the Sorbonne, she signed her name the French way: <strong>Marie</strong>.",
      "Her student years were hungry and cold and completely happy. She rented a tiny attic room under the roof, where the water froze in the basin on winter mornings; some evenings she dined on bread, butter and tea; once she fainted from hunger beside her books. But no one could stop her from learning now. She studied as though making up for every closed door of her childhood, and she finished <strong>first</strong> in her physics degree — the top of the whole class.",
      "Around that time she met a quiet, gentle scientist named Pierre Curie, who loved magnets, crystals, and long walks. Pierre saw at once that Marie's mind was extraordinary. He wrote her letters about science the way other men wrote poems. They married — Marie in a plain navy-blue dress she could wear in the laboratory afterwards — and became partners in everything: in life, and in the great mystery they were about to chase.",
      "The mystery was this: a scientist named Becquerel had noticed that a rock containing uranium gave off strange, invisible rays, all by itself, without sunlight, without fire, without anything. Nobody knew why. Marie chose this puzzle for her research — and soon made a thrilling discovery: one crumbly black ore, called <strong>pitchblende</strong>, poured out far more rays than its uranium could explain. Something unknown was hiding inside it. Something new to the whole world.",
      "To find it, Marie and Pierre were given only a leaky wooden <strong>shed</strong> with a cracked glass roof — too hot in summer, freezing in winter. Other scientists chuckled at it. In that shed, Marie boiled and stirred great cauldrons of pitchblende with an iron rod nearly as tall as herself, tons of it, sack after sack, month after month, her arms aching, her notebooks filling with careful numbers. And slowly, like someone panning a river for a single fleck of gold, she closed in on her invisible treasure. In 1898 the Curies announced not one but <strong>two new elements</strong>: <em>polonium</em>, named for Marie's beloved Poland, and <em>radium</em>, whose salts glowed in the dark with a soft blue-green light. At night, Marie and Pierre sometimes tiptoed back to the shed just to stand among the shelves and watch their little glass dishes glowing like captive stars. \"Look,\" Pierre would whisper. \"Look…\"",
      "Marie named the strange energy <strong>radioactivity</strong>, and the world took notice. In 1903 she became the first woman in history to win a <strong>Nobel Prize</strong>, sharing it with Pierre and Becquerel. And after great sorrow — for she lost her dear Pierre in an accident — she carried their work on alone, became the Sorbonne's first woman professor, and in 1911 won a <strong>second Nobel Prize</strong>, this time in chemistry. No one — man or woman — had ever done that before.",
      "And here is the part of the story that glows brightest. Marie's discoveries became a gift to everyone. Doctors learned to use rays to see inside the body and to fight illness. When a great war broke out, Marie built little X-ray cars — the soldiers called them <em>petites Curies</em>, \"little Curies\" — and drove to the front herself, with her teenage daughter Irène, to help wounded soldiers. She could have become rich by keeping radium's secrets for herself. She refused. \"Radium belongs to the people,\" she said. Years later, her daughter Irène won a Nobel Prize too — the wonder, it seems, ran in the family.",
      "So, my little dreamer, remember Maria from Warsaw: the girl who studied in secret while listening for footsteps, who rode across Europe on a wooden stool, who stirred a cauldron for years to find a teaspoon of glowing treasure. \"Nothing in life is to be feared,\" she said. \"It is only to be understood.\" Whatever door ever seems closed to you, remember that patience and curiosity are the gentlest, strongest keys ever made.",
      "Close your eyes now. Somewhere in the dark, atoms are quietly glowing, just as they did in Marie's little shed — tiny lights that never stop shining, like questions waiting for morning. Sleep well, my love. Goodnight."
    ],
    sw: [
      "Jikaribishe karibu, mdogo wangu. Hadithi ya usiku wa leo ni ya msichana aliyeambiwa hawezi — na ambaye kwa utulivu, kwa subira, alikuwa mmoja wa wanasayansi wakubwa zaidi waliowahi kuishi. Jina lake lilikuwa Maria.",
      "Maria Skłodowska alizaliwa mwaka wa 1867 mjini Warsaw, mji mkuu wa Poland, mtoto wa mwisho kati ya watano katika familia iliyokuwa tajiri kwa kitu kimoja hasa: elimu. Baba yake alifundisha fizikia na hisabati; mama yake aliendesha shule ya wasichana. Nyumba yao ilijaa vitabu, na kwenye rafu ya baba yake kulisimama kabati la vifaa vya sayansi — mirija ya kioo, mizani, madini — ambavyo Maria mdogo alivitazama kwa mshangao kama watoto wengine wanavyotazama peremende dirishani mwa duka.",
      "Maria alijifundisha kusoma akiwa na miaka minne, akichungulia juu ya bega la dada yake mkubwa. Kumbukumbu yake ilikuwa ya ajabu: aliweza kukariri mashairi baada ya kuyasikia mara mbili, na familia yake wakati mwingine ilimjaribu ili tu kucheka kwa mshangao. Lakini miaka ile ya mwanzo yenye mwanga ilizidi kuwa migumu. Maria alipokuwa mdogo, mama yake aliugua sana na akafariki, na pesa zikapungua. Na juu ya nchi nzima kulilala kivuli kizito zaidi: Poland ilitawaliwa wakati ule na himaya ya mbali, iliyokataza shule kufundisha kwa Kipolandi. Hata lugha ya watoto wenyewe ilibidi inong'onwe.",
      "Katika dunia ya Maria kulikuwa na dhuluma moja zaidi, nayo ilimlenga moja kwa moja: <strong>vyuo vikuu havikupokea wasichana</strong>. Maria alimaliza shule akiwa na miaka kumi na mitano na medali ya dhahabu — mwanafunzi bora darasani mwake — kisha akasimama mbele ya mlango uliofungwa. Kaka zake wangeweza kusoma. Yeye hangeweza. Si kwa kukosa kipaji. Ni kwa sababu tu alikuwa msichana.",
      "Je, Maria alikata tamaa? Hakukata. Jioni alinyata katika mitaa ya Warsaw kwenda mikusanyiko ya siri ambayo wanafunzi waliiita <strong>Chuo Kikuu cha Kuruka</strong> — cha kuruka, kwa sababu masomo yaliruka nyumba hadi nyumba ili mamlaka isiyapate. Katika vyumba hafifu vyenye mapazia yaliyofungwa, wasichana walisoma biolojia, kemia, na historia, wakipeana vitabu mkono kwa mkono, wakisikiliza nyayo ngazini. Kujifunza, kwao, kulikuwa kitendo cha ujasiri.",
      "Kisha Maria na dada yake mkubwa Bronya walifanya agano — moja ya maagano mazuri zaidi ambayo dada wawili wamewahi kufanya. Paris, mbali nchini Ufaransa, chuo kikuu kikubwa cha Sorbonne kilipokea wanawake. Lakini dada hao walikuwa maskini. Basi wakakubaliana: Maria angefanya kazi na kutuma pesa ili Bronya asome udaktari kwanza; kisha Bronya, akiwa daktari, angemsaidia Maria. Na ndivyo walivyofanya. Kwa miaka sita mirefu, Maria alifanya kazi ya ulezi mashambani, akifundisha watoto wa wengine, akisoma peke yake usiku kwa vitabu vya kuazima — fizikia, aljebra, kemia — akisubiri zamu yake.",
      "Hatimaye, barua ikaja: <em>Njoo Paris.</em> Maria, sasa na miaka ishirini na minne, alipanda behewa la bei rahisi zaidi la treni akiwa na kigoda cha kukunja cha kuketi, blanketi, na sanduku la vitabu, na akasafiri kwa siku nyingi kuvuka Ulaya. Alipojiandikisha Sorbonne, alisaini jina lake kwa mtindo wa Kifaransa: <strong>Marie</strong>.",
      "Miaka yake ya uanafunzi ilikuwa ya njaa na baridi na furaha kamili. Alipanga chumba kidogo cha dari chini ya paa, ambako maji yaliganda ndani ya beseni asubuhi za baridi; jioni nyingine alikula mkate, siagi na chai; mara moja alizimia kwa njaa kando ya vitabu vyake. Lakini sasa hakuna angeweza kumzuia kujifunza. Alisoma kana kwamba analipia kila mlango uliofungwa wa utoto wake, na akamaliza <strong>wa kwanza</strong> katika shahada yake ya fizikia — kileleni mwa darasa zima.",
      "Wakati ule alikutana na mwanasayansi mkimya na mpole aitwaye Pierre Curie, aliyependa sumaku, fuwele, na matembezi marefu. Pierre aliona mara moja kwamba akili ya Marie ilikuwa ya kipekee. Alimwandikia barua za sayansi kama wanaume wengine walivyoandika mashairi. Walifunga ndoa — Marie akiwa na gauni la rangi ya bluu ya baharini la kawaida ambalo angeweza kulivaa maabara baadaye — na wakawa washirika katika kila kitu: katika maisha, na katika fumbo kubwa walilokaribia kulifukuzia.",
      "Fumbo lilikuwa hili: mwanasayansi aitwaye Becquerel alikuwa amegundua kwamba jiwe lenye urani lilitoa miale ya ajabu isiyoonekana, lenyewe tu, bila jua, bila moto, bila chochote. Hakuna aliyejua kwa nini. Marie alichagua kitendawili hiki kwa utafiti wake — na muda si mrefu akafanya ugunduzi wa kusisimua: mchanga mmoja mweusi unaobomoka, uitwao <strong>pitchblende</strong>, ulimwaga miale mingi zaidi kuliko urani wake ungeweza kueleza. Kitu kisichojulikana kilikuwa kimejificha ndani yake. Kitu kipya kwa dunia nzima.",
      "Ili kukipata, Marie na Pierre walipewa tu <strong>kibanda</strong> cha mbao kilichovuja chenye paa la kioo lililopasuka — joto mno kiangazi, baridi kali wakati wa baridi. Wanasayansi wengine walikicheka. Katika kibanda kile, Marie alichemsha na kukoroga masufuria makubwa ya pitchblende kwa fimbo ya chuma karibu ndefu kama yeye mwenyewe, tani na tani, gunia baada ya gunia, mwezi baada ya mwezi, mikono yake ikiuma, madaftari yake yakijaa namba za makini. Na taratibu, kama mtu anayechekecha mto kutafuta chembe moja ya dhahabu, alikaribia hazina yake isiyoonekana. Mwaka wa 1898 akina Curie walitangaza si elementi moja bali <strong>mbili mpya</strong>: <em>polonium</em>, kwa jina la Poland pendwa ya Marie, na <em>radium</em>, ambayo chumvi zake ziling'aa gizani kwa mwanga hafifu wa buluu-kijani. Usiku, Marie na Pierre wakati mwingine walinyata kurudi kibandani ili tu kusimama kati ya rafu na kutazama visahani vyao vidogo vya kioo viking'aa kama nyota mateka. \"Tazama,\" Pierre alinong'ona. \"Tazama…\"",
      "Marie aliita nishati ile ya ajabu <strong>radioactivity</strong>, na dunia ikashtuka. Mwaka wa 1903 akawa mwanamke wa kwanza katika historia kushinda <strong>Tuzo ya Nobel</strong>, akishirikiana na Pierre na Becquerel. Na baada ya huzuni kubwa — kwani alimpoteza Pierre wake mpendwa katika ajali — aliendeleza kazi yao peke yake, akawa profesa mwanamke wa kwanza wa Sorbonne, na mwaka wa 1911 akashinda <strong>Tuzo ya pili ya Nobel</strong>, safari hii katika kemia. Hakuna mtu — mwanamume wala mwanamke — aliyewahi kufanya hivyo kabla.",
      "Na hii ndiyo sehemu ya hadithi inayong'aa zaidi. Uvumbuzi wa Marie ukawa zawadi kwa kila mtu. Madaktari walijifunza kutumia miale kuona ndani ya mwili na kupambana na magonjwa. Vita vikubwa vilipozuka, Marie alijenga magari madogo ya X-ray — askari waliyaita <em>petites Curies</em>, \"Curie wadogo\" — na akaendesha mwenyewe hadi uwanja wa mapigano, na binti yake kijana Irène, kusaidia askari waliojeruhiwa. Angeweza kuwa tajiri kwa kujiwekea siri za radium. Alikataa. \"Radium ni ya watu,\" alisema. Miaka mingi baadaye, binti yake Irène naye alishinda Tuzo ya Nobel — maajabu, inaonekana, yalikuwa ya ukoo.",
      "Basi, mwotaji wangu mdogo, mkumbuke Maria wa Warsaw: msichana aliyesoma kwa siri huku akisikiliza nyayo, aliyesafiri kuvuka Ulaya juu ya kigoda cha mbao, aliyekoroga sufuria kwa miaka ili kupata kijiko kidogo cha hazina ing'aayo. \"Hakuna kitu maishani cha kuogopwa,\" alisema. \"Kipo cha kueleweka tu.\" Mlango wowote utakaowahi kuonekana umefungwa kwako, kumbuka kwamba subira na udadisi ni funguo laini na zenye nguvu zaidi zilizowahi kutengenezwa.",
      "Funga macho sasa. Mahali fulani gizani, atomi zinang'aa kimyakimya, kama zilivyong'aa katika kibanda kidogo cha Marie — taa ndogo zisizoacha kuangaza, kama maswali yanayosubiri asubuhi. Lala vizuri, mpenzi wangu. Lala salama."
    ],
    fr: [
      "Blottis-toi bien, mon petit. L'histoire de ce soir est celle d'une fille à qui l'on disait « tu ne peux pas » — et qui, doucement, patiemment, est devenue l'une des plus grandes scientifiques de tous les temps. Elle s'appelait Maria.",
      "Maria Skłodowska est née en 1867 à Varsovie, la capitale de la Pologne, la plus jeune de cinq enfants d'une famille riche d'une seule chose : le savoir. Son père enseignait la physique et les mathématiques ; sa mère dirigeait une école de filles. Leur appartement débordait de livres, et sur l'étagère de son père trônait une vitrine d'instruments scientifiques — tubes de verre, balances, minéraux — que la petite Maria admirait comme d'autres enfants admirent les bonbons dans la vitrine d'une boutique.",
      "Maria a appris à lire toute seule à quatre ans, en regardant par-dessus l'épaule de sa grande sœur. Sa mémoire était stupéfiante : elle récitait des poèmes après les avoir entendus deux fois, et sa famille la testait parfois juste pour rire d'émerveillement. Mais ces premières années lumineuses sont devenues difficiles. Quand Maria était petite, sa maman est tombée très malade et est morte, et l'argent a manqué. Et sur tout le pays s'étendait une ombre plus lourde : la Pologne était alors gouvernée par un empire lointain, qui interdisait aux écoles d'enseigner en polonais. Même la langue des enfants devait se chuchoter.",
      "Dans le monde de Maria, il y avait encore une injustice, et elle la visait directement : <strong>les universités n'acceptaient pas les filles</strong>. Maria a fini l'école à quinze ans avec une médaille d'or — la meilleure élève de sa classe — puis s'est retrouvée devant une porte fermée. Ses frères pouvaient étudier. Elle, non. Non par manque de talent. Simplement parce qu'elle était une fille.",
      "Maria a-t-elle abandonné ? Non. Le soir, elle se glissait dans les rues de Varsovie vers des réunions secrètes que les étudiants appelaient <strong>l'Université volante</strong> — volante, parce que les cours volaient d'appartement en appartement pour que les autorités ne les trouvent pas. Dans des pièces sombres aux rideaux tirés, des jeunes femmes étudiaient la biologie, la chimie et l'histoire, se passant les livres de main en main, en guettant les pas dans l'escalier. Apprendre, pour elles, était un acte de courage.",
      "Puis Maria et sa grande sœur Bronya ont conclu un pacte — l'un des plus beaux pactes que deux sœurs aient jamais faits. À Paris, loin en France, la grande université de la Sorbonne acceptait les femmes. Mais les sœurs étaient pauvres. Alors elles ont décidé : Maria travaillerait et enverrait de l'argent pour que Bronya étudie d'abord la médecine ; puis Bronya, devenue docteure, aiderait Maria à son tour. Et c'est ce qu'elles ont fait. Pendant six longues années, Maria a travaillé comme gouvernante à la campagne, enseignant aux enfants des autres, étudiant seule la nuit dans des livres empruntés — physique, algèbre, chimie — en attendant son tour.",
      "Enfin, la lettre est arrivée : <em>Viens à Paris.</em> Maria, alors âgée de vingt-quatre ans, est montée dans le wagon le moins cher avec un tabouret pliant pour s'asseoir, une couverture et une malle de livres, et a voyagé des jours à travers l'Europe. En s'inscrivant à la Sorbonne, elle a signé son prénom à la française : <strong>Marie</strong>.",
      "Ses années d'étudiante furent affamées, glacées et parfaitement heureuses. Elle louait une minuscule chambre de bonne sous les toits, où l'eau gelait dans la cuvette les matins d'hiver ; certains soirs, elle dînait de pain, de beurre et de thé ; une fois, elle s'est évanouie de faim à côté de ses livres. Mais plus personne ne pouvait l'empêcher d'apprendre. Elle a étudié comme pour rattraper chaque porte fermée de son enfance, et elle a fini <strong>première</strong> de sa licence de physique — au sommet de toute la classe.",
      "C'est à cette époque qu'elle a rencontré un savant discret et doux nommé Pierre Curie, qui aimait les aimants, les cristaux et les longues promenades. Pierre a tout de suite vu que l'esprit de Marie était extraordinaire. Il lui écrivait des lettres sur la science comme d'autres hommes écrivent des poèmes. Ils se sont mariés — Marie dans une simple robe bleu marine qu'elle pourrait remettre ensuite au laboratoire — et sont devenus partenaires en tout : dans la vie, et dans le grand mystère qu'ils allaient poursuivre.",
      "Le mystère était celui-ci : un savant nommé Becquerel avait remarqué qu'une roche contenant de l'uranium émettait d'étranges rayons invisibles, toute seule, sans soleil, sans feu, sans rien. Personne ne savait pourquoi. Marie a choisi cette énigme pour ses recherches — et a bientôt fait une découverte palpitante : un minerai noir et friable, appelé <strong>pechblende</strong>, déversait bien plus de rayons que son uranium ne pouvait l'expliquer. Quelque chose d'inconnu se cachait à l'intérieur. Quelque chose de nouveau pour le monde entier.",

  textM: {
    en: [
      "In the city of Pisa, in Italy, where a famous tower leans a little to one side, a baby boy was born. His parents called him Galileo. Their house was full of music, because his father played the lute. In the evenings the soft notes drifted out of the window and down into the narrow street, and the whole family sang together.",
      "Galileo learned to play the lute too, and he played it well all his life. But he was even better at noticing things. One day in the big cool cathedral, he watched a hanging lamp swing slowly to and fro on its long chain. He counted with his own heartbeat: thump, thump, thump. Long swing or short swing, each one seemed to take the same time. Nobody had taught him that. He had found it out simply by <strong>watching</strong>.",
      "His father hoped he would become a doctor. But numbers kept calling him. Galileo filled his notebooks with shapes and sums until at last his father let him study mathematics instead. He wanted to know how things move. He rolled balls down long polished wooden slopes, over and over, timing them carefully. He learned that a heavy ball and a light ball fall together, side by side. Everybody had thought the heavy one would win.",
      "Then, when Galileo was a grown man, news arrived from Holland. Someone had made a tube with glass at each end that made faraway things look close. Galileo had never even seen one. He simply went home, thought hard about the shapes the glass would need, and ground his own lenses by hand. His tube was better than the first. He called it a <strong>telescope</strong>.",
      "On a cold, clear night he carried it outside and pointed it up at the sky. What he saw made his heart beat fast. The Moon was not a smooth silver coin at all. It had mountains and valleys and long soft shadows, like a country waiting to be visited. And the pale milky smudge that crosses the sky broke apart into thousands and thousands of tiny stars. 'There are more stars than anyone ever dreamed,' he wrote.",
      "A few nights later he looked at Jupiter, the giant planet, and saw four little points of light beside it. He looked again the next night, and the next. They had moved. They were moons, dancing round Jupiter the way our Moon dances round us. So not everything in the sky circles the Earth. The Earth is not standing still either — it travels round the <strong>Sun</strong>, turning as it goes.",
      "Not everyone was ready to believe him. Some people said the little tube must be playing tricks. That made Galileo sad. But he did not stop looking, and he did not stop asking questions. 'Come and look for yourself,' he would say, and he would hand his telescope to anyone willing to try. Slowly, one by one, people looked — and they saw the moons of Jupiter too.",
      "He went on writing and teaching until he was a very old man, even when his eyes grew tired and dim. Today we call Galileo the father of modern <strong>science</strong>, because he taught the world a wonderful habit. Do not only guess. Do not only believe what you are told. Go and look. Measure it. Try it again. Every scientist since then — and every curious child with a question at bedtime — is walking along the path he opened."

    sw: [
      "Katika mji wa Pisa, nchini Italia, ambako mnara maarufu umeegemea kidogo upande mmoja, mtoto wa kiume alizaliwa. Wazazi wake wakamwita Galileo. Nyumba yao ilijaa muziki, kwa sababu baba yake alipiga kinubi. Jioni sauti nyororo zilitoka dirishani na kushuka barabarani, na familia nzima iliimba pamoja.",
      "Galileo naye alijifunza kupiga kinubi, na alikipiga vizuri maisha yake yote. Lakini alikuwa hodari zaidi wa kuchunguza vitu. Siku moja ndani ya kanisa kubwa lenye ubaridi, alitazama taa iliyoning'inia ikiyumba taratibu huku na huku kwenye mnyororo mrefu. Alihesabu kwa mapigo ya moyo wake: pi, pi, pi. Iwe mzunguko mrefu au mfupi, kila mmoja ulionekana kuchukua muda uleule. Hakuna aliyemfundisha jambo hilo. Alikuwa amelipata kwa <strong>kutazama</strong> tu.",
      "Baba yake alitumaini angekuwa daktari. Lakini namba ziliendelea kumwita. Galileo alijaza madaftari yake maumbo na mahesabu hadi hatimaye baba yake akamruhusu asome hisabati badala yake. Alitaka kujua jinsi vitu vinavyosogea. Alivingirisha mipira kwenye miteremko mirefu ya mbao laini, tena na tena, akipima muda kwa makini. Alijifunza kwamba mpira mzito na mpira mwepesi huanguka pamoja, bega kwa bega. Kila mtu alikuwa akidhani mzito ndio ungeshinda.",

    fr: [
      "Dans la ville de Pise, en Italie, où une tour célèbre penche un peu sur le côté, naquit un petit garçon. Ses parents l'appelèrent Galilée. Leur maison était pleine de musique, car son père jouait du luth. Le soir, les notes douces s'échappaient par la fenêtre et descendaient dans la ruelle, et toute la famille chantait ensemble.",
      "Galilée apprit lui aussi à jouer du luth, et il en joua bien toute sa vie. Mais il était encore meilleur pour observer. Un jour, dans la grande cathédrale fraîche, il regarda une lampe suspendue se balancer lentement au bout de sa longue chaîne. Il compta avec les battements de son cœur : toc, toc, toc. Grand balancement ou petit, chacun semblait durer le même temps. Personne ne le lui avait appris. Il l'avait découvert simplement en <strong>regardant</strong>.",
      "Son père espérait qu'il deviendrait médecin. Mais les nombres n'arrêtaient pas de l'appeler. Galilée remplit ses cahiers de figures et de calculs, jusqu'à ce que son père le laisse enfin étudier les mathématiques. Il voulait savoir comment les choses bougent. Il fit rouler des billes sur de longues pentes de bois poli, encore et encore, en mesurant soigneusement le temps. Il apprit qu'une bille lourde et une bille légère tombent ensemble, côte à côte. Tout le monde croyait pourtant que la lourde gagnerait.",
      "Puis, quand Galilée fut un homme, une nouvelle arriva de Hollande. Quelqu'un avait fabriqué un tube avec du verre aux deux bouts, qui rapprochait les choses lointaines. Galilée n'en avait même jamais vu un. Il rentra simplement chez lui, réfléchit longuement à la forme qu'il fallait donner au verre, et tailla ses propres lentilles à la main. Son tube était meilleur que le premier. Il l'appela <strong>télescope</strong>.",
      "Par une nuit froide et claire, il le porta dehors et le pointa vers le ciel. Ce qu'il vit fit battre son cœur très vite. La Lune n'était pas du tout une pièce d'argent toute lisse. Elle avait des montagnes, des vallées et de longues ombres douces, comme un pays qui attend qu'on lui rende visite. Et la traînée blanchâtre qui traverse le ciel se sépara en des milliers et des milliers de minuscules étoiles. « Il y a plus d'étoiles que personne n'a jamais rêvé », écrivit-il.",
      "Quelques nuits plus tard, il observa Jupiter, la planète géante, et vit quatre petits points de lumière à côté d'elle. Il regarda encore la nuit suivante, et celle d'après. Ils avaient bougé. C'étaient des lunes, qui dansaient autour de Jupiter comme notre Lune danse autour de nous. Donc tout ne tourne pas autour de la Terre. Et la Terre ne reste pas immobile non plus — elle voyage autour du <strong>Soleil</strong>, en tournant sur elle-même.",

      "Il continua d'écrire et d'enseigner jusqu'à un très grand âge, même quand ses yeux devinrent fatigués et faibles. Aujourd'hui nous appelons Galilée le père de la <strong>science</strong> moderne, car il apprit au monde une merveilleuse habitude. Ne te contente pas de deviner. Ne te contente pas de croire ce qu'on te dit. Va regarder. Mesure. Recommence. Chaque scientifique depuis lui — et chaque enfant curieux qui pose une question le soir — marche sur le chemin qu'il a ouvert."

  textM: {
    en: [
      "About six hundred years ago, in the German town of Mainz, beside the wide grey river Rhine, a boy was born and named Johannes Gutenberg. Church bells rang over the rooftops. Barges floated slowly past with wool and wine. His father worked with the men who made the city's coins, so from the time he was very small Johannes knew the smell of hot metal and the tap-tap-tap of little hammers.",
      "In those days, a book was a treasure. Every single one had to be copied out by hand. A patient monk would sit at a high desk with a quill pen, forming one letter at a time, month after month after month. One book could take a whole year. Books were so precious that some were kept on chains so nobody could carry them away. Most children never held one in their lives.",
      "Johannes trained as a goldsmith. His hands learned tiny, careful, beautiful work. And somewhere in all that quiet tapping, a wonderful idea came to him. What if every letter were its own small metal stamp? Then you could line the stamps up to make words, print a whole page, take them apart again — and use the very same letters for the next page, and the next, forever.",
      "It sounds simple. It was not. He had to invent many things at once. He mixed a special metal, soft enough to pour into moulds but hard enough to press thousands of times. He made a thick, sticky ink, more like paint, because ordinary writing ink just slid off the metal. And he built a strong <strong>printing press</strong>, rather like the presses that squeeze grapes, so a big flat plate could push the paper down evenly. It took him years of trying, and failing, and trying again.",
      "Imagine his workshop. Little metal letters sleeping in wooden trays. The apprentice picking them out one by one and setting them backwards, so they would come out the right way round. The smell of oily black ink. Then the great wooden handle pulled hard, a squeak, a pause — and the paper lifted away with neat rows of perfect words upon it. Then again. And again. And again.",
      "One of the first big books he printed was a Bible, and it was so beautiful that people could hardly believe no hand had written it. Soon printers were setting up their workshops in other towns, and other countries, and other languages. Within one lifetime there were millions of books in the world, where before there had been only a few thousand.",
      "That changed everything. A clever idea thought up in one town could now travel to a thousand towns. Sailors printed maps. Doctors printed what they had learned. Teachers printed lessons, and children began learning to <strong>read</strong>, not just kings and priests. Stories that had only ever been spoken aloud were caught on paper and kept safe.",
      "Johannes Gutenberg never became rich, and he did not live to see how far his letters would travel. But think of your bookshelf tonight. Think of your school library, your comics, the words on a cereal box, the pages of this very story. All of it began with a patient man in Mainz who believed that books should not belong to a few people — they should belong to everyone."

    fr: [
      "Il y a environ six cents ans, dans la ville allemande de Mayence, au bord du large fleuve gris qu'on appelle le Rhin, naquit un garçon nommé Johannes Gutenberg. Les cloches des églises sonnaient au-dessus des toits. Des péniches passaient lentement, chargées de laine et de vin. Son père travaillait avec les hommes qui fabriquaient les pièces de monnaie de la ville, alors tout petit déjà, Johannes connaissait l'odeur du métal chaud et le toc-toc-toc des petits marteaux.",

      "Johannes apprit le métier d'orfèvre. Ses mains apprirent le travail minuscule, soigneux et joli. Et au milieu de tous ces petits coups tranquilles, une idée merveilleuse lui vint. Et si chaque lettre était son propre petit tampon de métal ? On pourrait alors aligner les tampons pour faire des mots, imprimer une page entière, les séparer à nouveau — et se servir exactement des mêmes lettres pour la page suivante, et la suivante, pour toujours.",
      "Cela semble simple. Cela ne l'était pas. Il dut inventer beaucoup de choses à la fois. Il mélangea un métal spécial, assez mou pour être coulé dans des moules mais assez dur pour être pressé des milliers de fois. Il fabriqua une encre épaisse et collante, presque comme de la peinture, car l'encre ordinaire glissait sur le métal. Et il construisit une solide <strong>imprimerie</strong>, un peu comme les pressoirs qui écrasent le raisin, pour qu'une grande plaque plate appuie le papier bien régulièrement. Il lui fallut des années d'essais, d'échecs et de nouveaux essais.",
      "Imagine son atelier. De petites lettres de métal endormies dans des casiers de bois. L'apprenti qui les choisit une à une et les range à l'envers, pour qu'elles sortent à l'endroit. L'odeur de l'encre noire et huileuse. Puis la grande poignée de bois tirée d'un coup ferme, un grincement, un silence — et le papier qu'on soulève, couvert de rangées nettes de mots parfaits. Puis encore. Et encore. Et encore.",
      "L'un des premiers grands livres qu'il imprima fut une Bible, si belle que les gens avaient du mal à croire qu'aucune main ne l'avait écrite. Bientôt, des imprimeurs ouvrirent leurs ateliers dans d'autres villes, d'autres pays, d'autres langues. En l'espace d'une seule vie, il y eut des millions de livres dans le monde, là où il n'y en avait eu que quelques milliers.",

      "Mwaka wa 1909, katika kijiji kidogo katika Pwani ya Dhahabu — Ghana ya leo — mvulana aitwaye Kwame Nkrumah alizaliwa. Mama yake aliuza mboga sokoni, na Kwame alikuwa mwanafunzi hodari sana hata akawa <strong>mwalimu</strong> akiwa bado mdogo sana.",
      "Kwame alisafiri mbali kwenda kusoma Amerika, ambako mara nyingi alikuwa maskini — aliosha vyombo na kufanya kazi kiwanda cha sabuni ili kulipia vitabu vyake. Lakini katika miaka hiyo migumu, swali moja kubwa lilikua ndani yake: kwa nini karibu nchi zote za Afrika zilitawaliwa kutoka mbali, na watu ambao hawakuwahi hata kuziona?",

    ],
    fr: [
      "En 1909, dans un petit village de la Côte-de-l'Or — le Ghana d'aujourd'hui — est né un garçon nommé Kwame Nkrumah. Sa mère vendait des légumes au marché, et Kwame était un élève si brillant qu'il est devenu <strong>instituteur</strong> très jeune.",
      "Kwame a navigué très loin pour étudier en Amérique, où il était souvent pauvre — il lavait la vaisselle et travaillait dans une fabrique de savon pour payer ses livres. Mais dans ces années difficiles, une grande question grandissait en lui : pourquoi presque tous les pays d'Afrique étaient-ils gouvernés de loin, par des gens qui ne les avaient même jamais vus ?",
      "Il est rentré chez lui avec une réponse : cela devait cesser. Kwame a organisé, écrit, parlé — pacifiquement mais sans relâche — et même depuis une cellule de prison, il a guidé son mouvement. Les gouvernants ont fini par comprendre la volonté du peuple. Et à <strong>minuit, le 6 mars 1957</strong>, Kwame s'est tenu devant une foule qui dansait, pleurait et chantait, et a déclaré : « Le Ghana, votre pays bien-aimé, est <strong>libre pour toujours</strong> ! »",
      "Le Ghana fut le premier — et comme la première étoile du soir, beaucoup d'autres l'ont suivi. Pays après pays, l'Afrique a hissé ses propres drapeaux. L'étoile noire de Kwame brille encore sur le drapeau du Ghana, murmurant à chaque enfant : un continent, comme une personne, est fait pour se tenir debout."
    ],
    ki: [
      "Mwaka-inĩ wa 1909, gĩcagi-inĩ kĩnini kĩa Gold Coast – Ghana ũmũthĩ – kahĩĩ getagwo Kwami Nkrumah nĩaciarĩirwo. Nyina endia mboga thokoinĩ, na Kwame arĩ mũrutwo mũthaka mũno nginya agĩtuĩka mwarimũ arĩ o mũnyinyi. Kwame aathire kũraihu gũthomera Amerika, kũrĩa kaingĩ aarĩ mũthĩni – agĩthambia indo na akĩruta wĩra kĩganda-inĩ gĩa thabuni kũrĩha mabuku make.",
      "No mĩaka-inĩ ĩyo mĩritũ, kĩũria kĩmwe gĩkũraga thĩinĩ wake: nĩkĩ mabũrũri mothe ma Afrika mathagwo kũraihu, andũ arĩa matamoneire? Agĩũka mũciĩ arĩ na anja: matiagĩrĩire gũkorwo. Kwame nĩ abangire, akĩandĩka, na akĩaria – na thayũ no arĩ na kĩyo – ona kuuma kahengereta-inĩ ka njera agĩtongoria gĩkĩro gĩake.",

  text: {

      "In a town called <strong>Kouroussa</strong>, in Guinea, there lived a boy named Camara Laye. His home had a wide courtyard, a big tree, and the sound of hammers ringing all day long.",
      "His father was a <strong>goldsmith</strong>. Little Laye would crouch quietly in the corner of the workshop and watch. His father would blow on the fire until it glowed orange, and slowly, slowly, a lump of gold would turn into a beautiful bracelet. To the boy it looked like <strong>magic</strong>. His mother was strong and wise, and she filled the house with stories and rice and laughter.",

    sw: [

    fr: [
      "Dans une ville appelée <strong>Kouroussa</strong>, en Guinée, vivait un garçon nommé Camara Laye. Chez lui, il y avait une grande cour, un grand arbre, et le bruit des marteaux qui résonnait toute la journée.",

  text: {

      "In a green university town called <strong>Nsukka</strong>, in Nigeria, a girl named Chimamanda learned to read before she was four. She loved books more than almost anything.",
